name: Release Linux Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-installers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Application & Packages
        run: |
          cd GW2EI.Executables/GW2EI.Applications/GW2EIParserAvalonia
          mkdir -p dist
          dotnet publish GW2EIParserAvalonia.csproj -c Release-Linux -o ./dist /p:CreateDeb=true /p:CreateRpm=true

      - name: Verify Output Files
        run: ls -la ./dist

      - name: Upload .deb and .rpm to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            **/*.deb
            **/*.rpm
          fail_on_unmatched_files: true