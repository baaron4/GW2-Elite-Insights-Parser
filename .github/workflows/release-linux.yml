name: Release Linux Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Packaging Tools
        run: |
          dotnet tool install -g dotnet-deb
          dotnet tool install -g dotnet-rpm

      - name: Build Application & Packages
        run: |
          dotnet deb publish -p . -c Release-Linux -o ./dist
          dotnet rpm publish -p . -c Release-Linux -o ./dist

      - name: Upload .deb and .rpm to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/*.deb
            **/*.rpm