    <div class="d-flex flex-column justify-content-center align-items-center max-wd-500px scale85">

                <label class="form-check-label" for="followCheck">Follow Selected</label>

            <div class="form-check mb-2 mr-2" :data-original-title="'Viewpoint will  rotate with selected actor, as long as selected actor is drawn and Follow Selected is checked'">
                <input type="checkbox" class="form-check-input" id="rotateSelected"

                <label class="form-check-label" for="rotateSelected">Rotate with Selected</label>
            </div>
            <div class="form-check mb-2 mr-2" :data-original-title="'Selected player in green, group in blue'">
                <input type="checkbox" class="form-check-input" id="subgroupCheck"
                       :checked="getAnimator().displaySettings.highlightSelectedGroup" v-on:change="getAnimator().toggleHighlightSelectedGroup()">
                <label class="form-check-label" for="subgroupCheck">Highlight Selected Group</label>
            </div>
            <div v-if="showSecondaryNPCs" class="form-check mb-2 mr-2" :data-original-title="'Display not important NPCs in the arena'">
                <input type="checkbox" class="form-check-input" id="trashCheck"
                       :checked="getAnimator().displaySettings.displayTrashMobs" v-on:change="getAnimator().toggleTrashMobs()">
                <label class="form-check-label" for="trashCheck">Secondary NPCs</label>
            </div>
            <div v-if="showMechanics" class="form-check mb-2 mr-2" :data-original-title="'Encounter mechanics'">
                <input type="checkbox" class="form-check-input" id="mechanicsCheck"
                       :checked="getAnimator().displaySettings.displayMechanics" v-on:change="getAnimator().toggleMechanics()">
                <label class="form-check-label" for="mechanicsCheck">Mechanics</label>
            </div>
            <div v-if="showSquadMarkers" class="form-check mb-2 mr-2" :data-original-title="'Squad markers, on the ground and on players'">
                <input type="checkbox" class="form-check-input" id="markersCheck"
                       :checked="getAnimator().displaySettings.displaySquadMarkers" v-on:change="getAnimator().toggleSquadMarkers()">
                <label class="form-check-label" for="markersCheck">Markers</label>
            </div>
            <div v-if="showSkills" class="form-check mb-2 mr-2" :data-original-title="'Player skills'">
                <input type="checkbox" class="form-check-input" id="skillsCheck"
                       :checked="getAnimator().displaySettings.displaySkillMechanics" v-on:change="getAnimator().toggleSkills()">
                <label class="form-check-label" for="skillsCheck">Skills</label>
            </div>
            <div class="form-check mb-2 mr-2" :data-original-title="'Use the in game hitbox size'">
                <input type="checkbox" class="form-check-input" id="actorHitboxCheck"
                       :checked="getAnimator().displaySettings.useActorHitboxWidth" v-on:change="getAnimator().toggleUseActorHitboxWidth()">
                <label class="form-check-label" for="actorHitboxCheck">Use Hitbox Size</label>
            </div>
            <div class="form-check mb-2 mr-2" :data-original-title="'Display all minions'">
                <input type="checkbox" class="form-check-input" id="allMinionsCheck"
                       :checked="getAnimator().displaySettings.displayAllMinions" v-on:change="getAnimator().toggleDisplayAllMinions()">
                <label class="form-check-label" for="allMinionsCheck">All Minions</label>
            </div>
            <div class="form-check mb-2 mr-2" :data-original-title="'Display current selection minions'">
                <input type="checkbox" class="form-check-input" id="selectedMinionsCheck"
                       :checked="getAnimator().displaySettings.displaySelectedMinions" v-on:change="getAnimator().toggleDisplaySelectedMinions()">
                <label class="form-check-label" for="selectedMinionsCheck">Selected's Minions</label>
            </div>
        </div>
        <div class="cr-settings-panel-anchor">
            <ul class="nav nav-pills d-flex flex-row justify-content-center scale85 cr-settings-panel-buttons">
                <li v-if="showSkills" class="nav-item">
                    <a class="nav-link" :class="{ active: showPlayerSkillDecorationsPanel }" :aria-expanded="showPlayerSkillDecorationsPanel" @click.prevent.stop="togglePlayerSkillDecorationsPanel">
                        Player Skill Decorations
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{ active: showCustomDecorationsPanel }" :aria-expanded="showCustomDecorationsPanel" @click.prevent.stop="toggleCustomDecorationsPanel"
                       data-original-title="Select an agent to enable this feature">
                        Custom Decorations
                    </a>
                </li>
            </ul>
            <div v-if="showSkills && showPlayerSkillDecorationsPanel" class="cr-settings-panel cr-settings-panel-skills" @click.stop>
                <div class="mb-2 separator-border-bottom">
                    <div class="font-weight-bold mb-1">
                        Global Skill Settings
                    </div>
                    <div style="display: flex; flex-wrap: wrap; justify-content: center; width: max-content; max-width: 560px; margin: 0 auto;">
                        <div class="form-check mb-2 mr-2" style="white-space: nowrap; flex: 0 0 auto;" v-for="skillCategory in skillCategories" :key="skillCategory.key">
                            <input type="checkbox" class="form-check-input" :id="'skill-category-' + skillCategory.key"
                                   :checked="(skillMechanicsMask & skillCategory.mask) > 0"
                                   @change="toggleSkillCategoryMask(skillCategory.mask)" @click.stop>
                            <label class="form-check-label" :for="'skill-category-' + skillCategory.key" @click.stop>
                                {{skillCategory.key}}
                            </label>
                        </div>
                    </div>
                </div>
                <div class="mb-1">
                    <div class="font-weight-bold mb-1">
                        Single Skill Selector
                    </div>
                    <div class="d-flex flex-row justify-content-center align-items-center mb-2">
                        <button type="button" class="btn btn-primary btn-sm rot-button mr-2" @click.stop="setAllSelectedSkills(true)">
                            Select all
                        </button>
                        <button type="button" class="btn btn-primary btn-sm rot-button" @click.stop="setAllSelectedSkills(false)">
                            Deselect all
                        </button>
                    </div>
                </div>
                <div class="cr-skill-list">
                    <div v-for="skill in skillList" :key="skill.id" class="cr-skill-entry"
                         :style="{opacity: (skill.categoryMask & getAnimator().displaySettings.skillMechanicsMask) === 0 ? 0.35 : 1}">
                        <input :id="'skill-decoration-' + skill.id" type="checkbox" v-model="selectedSkills['s' + skill.id]" @change="onSelectedSkillsChanged" @click.stop>
                        <label :for="'skill-decoration-' + skill.id" class="rot-font">
                            <img class="icon" :src="skill.icon" :alt="skill.name"> {{skill.name}}
                        </label>
                    </div>
                </div>
            </div>
            <div v-show="showCustomDecorationsPanel" class="cr-settings-panel cr-settings-panel-custom" @click.stop>
                <div class="d-flex flex-row justify-content-center" :class="{'ei-disabled': !animationStatus.selectedExtraDecorations}">
                    <div class="mr-3">
                        <h4>Range Selectors</h4>
                        <div class="form-check mt-1 mb-2">
                            <input type="checkbox" class="form-check-input" id="circle1Check"
                                   :checked="false" v-on:change="getAnimator().toggleRange(0, $event.target.checked)">
                            <label class="form-check-label" for="circle1Check">Circle 1</label>
                        </div>
                        <div class="d-flex flex-row justify-content-between align-items-center">
                            <span>Radius: </span>
                            <custom-numberform-component class="wd-100px" :minValue="1" :id="'circle1Text'"
                                                         :placeholderValue="180"></custom-numberform-component>
                        </div>
                        <div class="form-check mt-1 mb-2">
                            <input type="checkbox" class="form-check-input" id="circle2Check"
                                   :checked="false" v-on:change="getAnimator().toggleRange(1, $event.target.checked)">
                            <label class="form-check-label" for="circle2Check">Circle 2</label>
                        </div>
                        <div class="d-flex flex-row justify-content-between align-items-center">
                            <span>Radius: </span>
                            <custom-numberform-component class="wd-100px" :minValue="1" :id="'circle2Text'"
                                                         :placeholderValue="360"></custom-numberform-component>
                        </div>
                        <div class="form-check mt-1 mb-2">
                            <input type="checkbox" class="form-check-input" id="circle3Check"
                                   :checked="false" v-on:change="getAnimator().toggleRange(2, $event.target.checked)">
                            <label class="form-check-label" for="circle3Check">Circle 3</label>
                        </div>
                        <div class="d-flex flex-row justify-content-between align-items-center">
                            <span>Radius: </span>
                            <custom-numberform-component class="wd-100px" :minValue="1" :id="'circle3Text'"
                                                         :placeholderValue="720"></custom-numberform-component>
                        </div>
                    </div>
                    <div class="ml-3">
                        <h4 data-original-title="Has an effect only when facing arrow are present">Cone Indicator</h4>
                        <div class="form-check mt-1 mb-2">
                            <input type="checkbox" class="form-check-input" id="coneCheck"
                                   :checked="false" v-on:change="getAnimator().toggleConeDisplay($event.target.checked)">
                            <label class="form-check-label" for="coneCheck">Display Cone</label>
                        </div>
                        <div class="d-flex flex-row justify-content-between align-items-center mb-1">
                            <span>Radius: </span>
                            <custom-numberform-component class="wd-100px" :minValue="1" :id="'coneRadiusText'"
                                                         :placeholderValue="360"></custom-numberform-component>
                        </div>
                        <div class="d-flex flex-row justify-content-between align-items-center mt-1">
                            <span>Opening: </span>
                            <custom-numberform-component class="wd-100px" :minValue="1" :maxValue="360" :id="'coneAngleText'"
                                                         :placeholderValue="90"></custom-numberform-component>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<script>
    Vue.component("combat-replay-extra-decorations-component", {
        props: ["light"],
        template: `${template}`,
        data: function () {  
            const skills = [];
            {
                const renderables = animator.skillMechanicActorData;
                const skillMap = new Map();

                renderables.forEach(function (decoration) {
                    const id = decoration.skillMode.skillID;
                    const skill = logData.skillMap["s" + id];

                    if (!skill) {
                        return;
                    }

                    const categoryMask = decoration.skillMode.category;
                    const existingSkill = skillMap.get(id);

                    if (existingSkill) {
                        existingSkill.categoryMask |= categoryMask;
                    } else {
                        const skillEntry = {
                            id: skill.id,
                            name: skill.name,
                            icon: skill.icon,
                            categoryMask: categoryMask
                        };

                        skillMap.set(id, skillEntry);
                        skills.push(skillEntry);
                    }
                });
            }
            return {
                animationStatus: reactiveAnimationData,
                showSkills: skills.length > 0,
                showMechanics: animator.overheadActorData.any() || animator.mechanicActorData.any(),
                showSquadMarkers: animator.squadMarkerData.any() || animator.overheadSquadMarkerData.any(),
                showSecondaryNPCs: animator.trashMobData.any(),
                skillMechanicsMask: animator.displaySettings.skillMechanicsMask,
                skillList: skills,
                selectedSkills: {},
                showPlayerSkillDecorationsPanel: false,
                showCustomDecorationsPanel: false,
            };
        },
        methods: {
            getAnimator: function () {
                return animator;
            },
            setAllSelectedSkills: function (selected) {
                var selectedSkills = {};

                this.skillList.forEach(function (skill) {
                    selectedSkills["s" + skill.id] = selected;
                });

                this.selectedSkills = selectedSkills;
                this.onSelectedSkillsChanged();
            },
            getSelectedSkillIds: function () {
                return this.skillList
                    .filter(skill => this.selectedSkills["s" + skill.id])
                    .map(skill => skill.id);
            },
            onSelectedSkillsChanged: function () {
                this.getAnimator().displaySettings.selectedSkillMechanicIds = this.getSelectedSkillIds();
                animateCanvas(noUpdateTime);
            },
            toggleSkillCategoryMask: function (mask) {
                const settings = this.getAnimator().displaySettings;
                settings.skillMechanicsMask ^= mask;
                this.skillMechanicsMask = settings.skillMechanicsMask;
                animateCanvas(noUpdateTime);
            },
            togglePlayerSkillDecorationsPanel: function () {
                this.showPlayerSkillDecorationsPanel = !this.showPlayerSkillDecorationsPanel;
                if (this.showPlayerSkillDecorationsPanel) {
                    this.showCustomDecorationsPanel = false;
                }
            },
            toggleCustomDecorationsPanel: function () {
                this.showCustomDecorationsPanel = !this.showCustomDecorationsPanel;
                if (this.showCustomDecorationsPanel) {
                    this.showPlayerSkillDecorationsPanel = false;
                }
            },
        },
        computed: {
            skillCategories: function () {
                var res = [];
                for (var key in SkillDecorationCategory) {
                    res.push({ key: key, mask: SkillDecorationCategory[key] });
                }
                return res;
            },
        },
        mounted() {
            $('#circle1Text').on("input ", function () {
                animator.setRangeRadius(0, Number.parseFloat($(this).val()));
            });
            $('#circle2Text').on("input ", function () {
                animator.setRangeRadius(1, Number.parseFloat($(this).val()));
            });
            $('#circle3Text').on("input ", function () {
                animator.setRangeRadius(2, Number.parseFloat($(this).val()));
            });
            $('#coneRadiusText').on("input ", function () {
                animator.setConeRadius(Number.parseFloat($(this).val()));
            });
            $('#coneAngleText').on("input ", function () {
                animator.setConeAngle(Number.parseFloat($(this).val()));
            });
            this.setAllSelectedSkills(true);
        }
    });
</script>
