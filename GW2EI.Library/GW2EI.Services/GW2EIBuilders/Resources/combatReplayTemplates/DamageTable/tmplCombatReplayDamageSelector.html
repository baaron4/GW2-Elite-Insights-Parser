<template>
    <div>
        <div class="d-flex flex-row justify-content-center align-items-center mb-2">
            <ul class="nav nav-pills" :class="{'flex-row': !column, 'flex-column': column}">
                <li class="nav-item" data-original-title="Power + Condition">
                    <a class="nav-link" @click="data.damagemode = damageModeEnum.All" :class="{active: data.damagemode === damageModeEnum.All}">
                        <img :src="UIIcons.Damage" alt="All" class="icon">
                    </a>
                </li>
                <li class="nav-item" data-original-title="Power">
                    <a class="nav-link" @click="data.damagemode = damageModeEnum.Power" :class="{active: data.damagemode === damageModeEnum.Power}">
                        <img :src="UIIcons.Power" alt="Power" class="icon">
                    </a>
                </li>
                <li class="nav-item" data-original-title="Condition">
                    <a class="nav-link" @click="data.damagemode = damageModeEnum.Condition" :class="{active: data.damagemode === damageModeEnum.Condition}">
                        <img :src="UIIcons.ConditionDamage" alt="Condition" class="icon">
                    </a>
                </li>
                <li class="nav-item" v-if="hasBreakbarDamage" data-original-title="Breakbar">
                    <a class="nav-link" @click="data.damagemode = damageModeEnum.Breakbar" :class="{active: data.damagemode === damageModeEnum.Breakbar}">
                        <img :src="UIIcons.Breakbar" alt="Breakbar" class="icon">
                    </a>
                </li>
            </ul>
        </div>

        <div class="d-flex flex-row justify-content-between mb-2 align-items-center">
            <fieldset class="border-0 d-flex">
                <!--<legend class="scale85 mb-0 ml-1">Window</legend>-->
                <ul class="nav nav-pills scale75" :class="{'flex-row': !column, 'flex-column': column}">
                    <li class="nav-item">
                        <a class="nav-link" @click="data.dpsmode = 0" :class="{active: data.dpsmode === 0}">Full</a>
                    </li>
                    <li v-if="phaseduration > 4" class="nav-item">
                        <a class="nav-link" @click="data.dpsmode = 4" :class="{active: data.dpsmode === 4}">4s</a>
                    </li>
                    <li v-if="phaseduration > 10" class="nav-item">
                        <a class="nav-link" @click="data.dpsmode = 10" :class="{active: data.dpsmode === 10}">10s</a>
                    </li>
                    <li v-if="phaseduration > 20" class="nav-item">
                        <a class="nav-link" @click="data.dpsmode = 20" :class="{active: data.dpsmode === 20}">20s</a>
                    </li>
                    <li v-if="phaseduration > 30" class="nav-item">
                        <a class="nav-link" @click="data.dpsmode = 30" :class="{active: data.dpsmode === 30}">30s</a>
                    </li>
                    <li v-if="phasehassubphases" class="nav-item">
                        <a class="nav-link" @click="data.dpsmode = -1" :class="{active: data.dpsmode === -1}">Phase</a>
                    </li>
                </ul>
                <custom-numberform-component class="ml-2 w-auto" :minValue="0" :maxValue="Math.floor(phaseduration / 2) * 2" :id="'customDPS'" :placeholderValue="0" />
            </fieldset>
            
            <fieldset class="border-0 d-flex">
                <!--<legend class="scale85 mb-0 ml-1">View</legend>-->
                <ul class="nav nav-pills d-flex flex-wrap justify-content-center scale75" :class="{'flex-row': !column, 'flex-column': column}">
                    <li class="nav-item">
                        <a class="nav-link" @click="data.graphmode = graphModeEnum.DPS" :class="{active: data.graphmode === graphModeEnum.DPS}">PS</a>
                    </li>
                    <li class="nav-item" data-original-title="Centered">
                        <a class="nav-link" @click="data.graphmode = graphModeEnum.CenteredDPS" :class="{active: data.graphmode === graphModeEnum.CenteredDPS}">Ctrd.PS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" @click="data.graphmode = graphModeEnum.Damage" :class="{active: data.graphmode === graphModeEnum.Damage}">Cumulative</a>
                    </li>
                </ul>
            </fieldset>
        </div>
    </div>
</template>

<script>
    Vue.component("combat-replay-damage-selector-component", {
        props: ['data', 'phaseduration', 'phasehassubphases', 'ignorebreakbar', "column"],
        template: `${template}`,
        mixins: [UIIconsComponent, tooltipSweepComponent],
        mounted() {
            var _this = this;
            $('#customDPS').on("input ", function () {
                _this.data.dpsmode = Math.ceil(Number.parseFloat($(this).val()) / 2) * 2;
            });
            $('#customDPS').on("click ", function () {
                _this.data.dpsmode = Math.ceil(Number.parseFloat($(this).val()) / 2) * 2;
            });
        },
        computed: {
            graphModeEnum: function() {
                return GraphType;
            },
            damageModeEnum: function() {
                return DamageType;
            },
            hasBreakbarDamage: function() {
                return !this.ignorebreakbar && logData.hasBreakbarDamage;
            },
        }
    });
</script>
