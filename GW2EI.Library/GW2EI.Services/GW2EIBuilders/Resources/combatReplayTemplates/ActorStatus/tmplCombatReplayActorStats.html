<template>
    <div class="actor-data p-1">
        <div v-if="buffs" class="mb-1">
            <combat-replay-actor-buff v-if="isPresent('Encounter Specifics')" :buffarray="data.encounterSpecifics" />
            <combat-replay-actor-buff v-if="isPresent('Others')" :buffarray="data.others" />
            <combat-replay-actor-buff v-if="isPresent('Conditions')" :buffarray="data.conditions" />
            <combat-replay-actor-buff v-if="isPresent('Shared')" :buffarray="data.shared" />
            <combat-replay-actor-buff v-if="isPresent('Boons')" :buffarray="data.boons" />
            <combat-replay-actor-buff v-if="isPresent('Consumables')" :buffarray="data.consumables" class="pb-1" />
        </div>

        <combat-replay-actor-status-component :time="time" :actorIndex="actorIndex" :isTarget="isTarget"
                                              :minionGroupIndex="isMinion ? minionGroupIndex : null" :minionIndex="isMinion ? minionIndex : null" />
        <combat-replay-actor-rotation-component v-if="rotation && !isMinion" :time="time" :actorindex="actorIndex" :isTarget="isTarget" />
        <combat-replay-actor-breakbars-component v-if="!isMinion" :actorIndex="actorIndex" :isTarget="isTarget" />
    </div>
</template>

<script>
    Vue.component("combat-replay-actor-stats-component", {
        mixins: [timeRefreshComponent, encounterPhaseComponent],
        props: ["actorIndex", "time", "buffstoshow", "isTarget", "buffs", "rotation", "minionGroupIndex", "minionIndex"],
        template: `${template}`,
        methods: {
            isPresent: function (type) {
                return this.buffstoshow.includes(type);
            }
        },
        computed: {
            isMinion: function () {
                return !this.isTarget && this.minionGroupIndex != null && this.minionIndex != null;
            },
            minionOwner: function () {
                if (!this.isMinion) {
                    return null;
                }
                return logData.players[this.actorIndex];
            },
            minion: function () {
                if (!this.isMinion) {
                    return null;
                }
                return this.minionOwner.details.minions[this.minionGroupIndex].instances[this.minionIndex];
            },
            minionInfo: function () {
                if (!this.isMinion) {
                    return null;
                }
                return this.minionOwner.minions[this.minionGroupIndex];
            },
            minionLabel: function () {
                if (!this.isMinion || !this.minionInfo) {
                    return "";
                }
                return this.minionInfo.name + "#" + (this.minionIndex + 1);
            },
            actor: function () {
                if (this.isTarget) {
                    return logData.targets[this.actorIndex];
                }
                return this.isMinion ? this.minion : logData.players[this.actorIndex];
            },
            boonGraph: function() {
                if (this.isMinion) {
                    return this.minion.boonGraph[this.encounterPhase.id] || [];
                }
                return this.actor.details.boonGraph[this.encounterPhase.id] || [];
            },
            data: function () {
                const res = {
                    shared: [],
                    boons: [],
                    conditions: [],
                    encounterSpecifics: [],
                    others: [],
                    consumables: []
                };
                const time = this.timeToUse / 1000 - this.encounterPhase.start;
                for (const { id, states } of this.boonGraph) {
                    const state = findState(states, time, 0, states.length - 1);
                    if (!state) {
                        continue;
                    }

                    const buff = findSkill(true, id);
                    if (buff.consumable) {
                        res.consumables.push({ state, buff });
                    }
                    else if (buff.encounterSpecific) {
                        res.encounterSpecifics.push({ state, buff });
                    }
                    else if (logData.boons.includes(id)) {
                        res.boons.push({ state, buff });
                    }
                    else if (logData.offBuffs.includes(id) || logData.defBuffs.includes(id) || logData.supBuffs.includes(id)) {
                        res.shared.push({ state, buff });
                    }
                    else if (logData.conditions.includes(id)) {
                        res.conditions.push({ state, buff });
                    }
                    else {
                        res.others.push({ state, buff });
                    }
                }
                return res;
            }
        }
    });
</script>
