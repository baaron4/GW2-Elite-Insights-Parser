<template>
    <div class="d-flex flex-row flex-wrap justify-content-center align-items-start">
        <div class="d-flex flex-row justify-content-center">
            <ul class="nav nav-pills d-flex flex-row scale85">
                <li class="nav-item">
                    <a class="nav-link" :class="{active: buffs}" @click="buffs = !buffs">
                        Buffs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: rotation}" @click="rotation = !rotation">
                        Rotation
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: minions}" @click="minions = !minions">
                        Minions
                    </a>
                </li>
            </ul>
            <ul class="nav nav-pills d-flex flex-row justify-content-center scale65" style="width: 250px;">
                <li v-for="(buffType, index) in possibleBuffs" class="ml-1 mr-1">
                    <input :id="'crpl-possibleBuffs-' + index" type="checkbox" :value="buffType" v-model="buffsToShow" />
                    <label :for="'crpl-possibleBuffs-' + index">{{buffType}}</label>
                </li>
            </ul>
        </div>

        <div class="d-flex">
            <div class="combat-actor-status-container scrollable-y mr-2" :class="{'mt-2' : singleGroup}">
                <fieldset v-for="(group, id) in groups" v-if="group"
                          :key="'player-group-' + id" class="border">
                    <legend v-if="!singleGroup" class="scale85 ml-1 px-1 w-auto">
                        Group {{id}}
                    </legend>
                    <div v-for="(player, index) in group"
                         :key="'player-status-' + player.uniqueID"
                         class="cr-player-minion-group"
                         :style="{ '--spec-color': player.colTarget || '#aaaaaa', borderBottom: index < group.length - 1 ? '1px solid #dee2e6' : 'none' }">
                        <combat-replay-actor-stats-component :class="{active: selectedactorid === player.uniqueID, 'cr-player-with-minions': minions && hasActiveMinions(player)}"
                                                             :actorIndex="player.id" :time="time" :buffstoshow="buffsToShow" :isTarget="false" :buffs="buffs" :rotation="rotation" />
                        <div v-if="minions && hasActiveMinions(player)"
                             :key="'minion-branch-' + player.uniqueID"
                             class="cr-minion-branch">
                            <div v-for="(minion, minionIndex) in player.details.minions"
                                 :key="'minion-group-' + player.uniqueID + '-' + minionIndex"
                                 style="display: contents;">
                                <combat-replay-actor-stats-component v-for="(minionInstance, minionInstanceIndex) in minion.instances" v-if="isMinionActive(minion)"
                                                                     :key="'minion-status-' + minion.uniqueID" class="cr-minion-row" :class="{active: selectedactorid === minionInstance.uniqueID, 'cr-minion-row-last': isLastActiveMinion(player, minionInstance)}"
                                                                     :minionIndex="minionIndex" :minionInstanceIndex="minionInstanceIndex"
                                                                     :actorIndex="player.id" :time="time" :buffstoshow="buffsToShow"
                                                                     :isTarget="false" :buffs="buffs" :rotation="rotation" />
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>

            <div class="combat-actor-status-container scrollable-y mt-2 ">
                <fieldset class="border">
                    <combat-replay-actor-stats-component v-for="target in targets"
                                                         :class="{active: selectedactorid === target.uniqueID}"
                                                         :actorIndex="target.id" :time="time" :buffstoshow="buffsToShowTarget" :isTarget="true" :buffs="true" :rotation="true" />
                </fieldset>
            </div>
        </div>
    </div>
</template>

<script>
    Vue.component("combat-replay-actors-stats-component", {
        props: ["time", "selectedactorid"],
        mixins: [encounterPhaseComponent, localStoragedSettings({
            buffs: {
                defaultValue: getValueFromLocalStorage("buffs") === "true"
            },
            rotation: {
                defaultValue: getValueFromLocalStorage("rotation") !== "false"
            },
            minions: {
                defaultValue: getValueFromLocalStorage("minions") === "true"
            },
        })],
        template: `${template}`,
        methods: {
            isMinionActive: function (minionInstance) {
                const actorData = animator ? animator.getActorData(minionInstance.uniqueID) : null;
                if (!actorData) {
                    return false;
                }
                return (actorData.start === -1 && actorData.end === -1) ||
                    (actorData.start <= this.time && actorData.end >= this.time);
            },
            hasActiveMinions: function (player) {
                const minionGroups = player.details && player.details.minions;
                return !!minionGroups && minionGroups.some(group =>
                    group.instances && group.instances.some(minionInstance => this.isMinionActive(minionInstance))
                );
            },
            isLastActiveMinion: function (player, minionInstance) {
                const minionGroups = player.details && player.details.minions;
                if (!minionGroups) {
                    return false;
                }
                let lastActiveMinionID = null;
                minionGroups.forEach(group => {
                    if (!group.instances) {
                        return;
                    }
                    group.instances.forEach(instance => {
                        if (this.isMinionActive(instance)) {
                            lastActiveMinionID = instance.uniqueID;
                        }
                    });
                });
                return lastActiveMinionID === minionInstance.uniqueID;
            },
        },
        data: function () {
            return {
                buffsToShow: ["Boons", "Encounter Specifics", "Conditions"],
                possibleBuffs: ["Boons", "Conditions", "Encounter Specifics", "Shared", "Consumables", "Others"]
            };
        },
        computed: {
            buffsToShowTarget: function () {
                return this.buffsToShow.filter(b => !["Shared", "Consumables"].includes(b));
            },
            singleGroup: function () {
                return logData.singleGroup;
            },
            targets: function () {
                if (logData.targetless) {
                    return [];
                }

                const result = logData.targets.filter(target => {
                    const crTarget = animator.getActorData(target.uniqueID);
                    return crTarget?.canDraw() &&
                        ((crTarget.start === -1 && crTarget.end === -1) ||
                            (crTarget.start <= this.time && crTarget.end >= this.time));
                });
                return result;
            },
            groups: function () {
                const result = [];
                const encounterPlayers = getActiveNonFakePlayersForPhase(this.encounterPhase);
                const players = getActiveNonFakePlayers(this.time * 0.001);

                for (let i = 0; i < players.length; i++) {
                    const playerData = players[i];

                    if (!playerData || !encounterPlayers[i] || !animator.getActorData(playerData.uniqueID)) {
                        continue;
                    }

                    (result[playerData.group] ??= []).push(playerData);
                }
                return result;
            }
        }
    });
</script>
