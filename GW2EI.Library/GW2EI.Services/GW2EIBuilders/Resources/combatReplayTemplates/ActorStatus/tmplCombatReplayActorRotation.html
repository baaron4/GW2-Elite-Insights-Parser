<template>
    <div class="actor-rotation">
        <div v-if="isAnimated(castingSkill)" class="actor-rotation-castbar" :style="getCastbarStyle(castingSkill)">
            {{ getCastbarTimes(castingSkill) }}
        </div>
        <div class="d-flex align-items-end actor-rotation-casts">
            <div v-if="castingSkill">
                <img class="icon-cur-cr-rota" :class="getIconClass(castingSkill)" :src="castingSkill.skill.icon" :title="getTooltip(castingSkill)" />
            </div>
            <div v-else class="empty-icon-cur-cr-rota"></div>

            <div v-for="next in nextSkills">
                <img class="icon-next-cr-rota" :class="getIconClass(next)" :src="next.skill.icon" :title="getTooltip(next)" />
            </div>
        </div>
    </div>
</template>

<script>
    Vue.component("combat-replay-actor-rotation-component", {
    mixins: [encounterPhaseComponent],
        props: ["time", "actorindex", "isTarget"],
        template: `${template}`,
        methods: {
            getIconClass(cast) {
                return {
                    'rot-cancelled': cast.type === RotationStatus.CANCEL,
                    'rot-unknown': cast.type === RotationStatus.UNKNOWN,
                    'rot-animfull': cast.type === RotationStatus.FULL,
                    'rot-instant': cast.type === RotationStatus.INSTANT
                };
            },
            getTooltip(cast) {
                const tooltip = `${cast.skill.name} at ${cast.time}s`;
                if (cast.type === RotationStatus.INSTANT) {
                    return tooltip;
                } else {
                    return tooltip + ` for ${cast.duration}ms`;
                }
            },
            isAnimated(cast) {
                return cast && cast.type !== RotationStatus.INSTANT;
            },
            getCastbarStyle(cast) {
                const progress = (this.time / 1000 - cast.time);
                const expected = cast.expected / 1000;
                if (progress >= expected) {
                    return "background: #0f0";
                } else {
                    const fill = 100 * progress / expected;
                    const end = cast.time + cast.duration / 1000;
                    const cancel = cast.type === RotationStatus.CANCEL && progress + 100 >= end;
                    const color = cancel ? "#f00" : "#f80";
                    return `background: linear-gradient(to right, ${color} ${fill}%, ${fill}%, #000 ${100 - fill}%`;
                }
            },
            getCastbarTimes(cast) {
                const expected = cast.expected / 1000;
                const progress = (this.time / 1000 - cast.time)
                return `${progress.toFixed(2)} / ${expected.toFixed(2)}`;
            }
        },
        computed: {
            actor: function () {
                return this.isTarget ? logData.targets[this.actorindex] : logData.players[this.actorindex];
            },
            actorRotation: function () {
                return this.actor.details.rotation[this.encounterPhase.id].map(skill => ({
                    time: skill[0],
                    skill: findSkill(false, skill[1]),
                    duration: skill[2],
                    type: skill[3],
                    expected: skill[5]
                }));
            },
            actorRotationDurationIndexes: function () {
                if (this.actorRotation.length === 0) {
                    return [];
                }

                let previous = -Infinity;
                let previousIndex = null;

                let next = this.actorRotation[0].time + this.actorRotation[0].duration / 1000.0;
                let nextIndex = 0;

                return this.actorRotation.map((item, index) => {
                    const duration = item.time + item.duration / 1000.0;

                    if (duration > next) {
                        next = duration;
                        nextIndex = index;
                    }
                    if (item.time >= previous) {
                        previous = next;
                        previousIndex = nextIndex;
                    }

                    return previousIndex;
                });
            },
            nextSkillIndex: function () {
                const time = this.time / 1000.0;
                return binarySearchFirstIndex(this.actorRotation, skill => skill.time > time);
            },
            castingSkill: function () {
                if (!this.nextSkillIndex || this.nextSkillIndex === 0) {
                    return null;
                }

                const actorRotationDurationIndex = this.actorRotationDurationIndexes[this.nextSkillIndex - 1];
                const candidates = this.actorRotation.slice(actorRotationDurationIndex, this.nextSkillIndex);

                const time = this.time / 1000.0;
                const result = candidates.findLast(c => c.time <= time && c.time + c.duration / 1000.0 >= time);
                return result;
            },
            nextSkills: function () {
                return this.actorRotation.slice(this.nextSkillIndex, this.nextSkillIndex + 8);
            }
        }
    });
</script>
