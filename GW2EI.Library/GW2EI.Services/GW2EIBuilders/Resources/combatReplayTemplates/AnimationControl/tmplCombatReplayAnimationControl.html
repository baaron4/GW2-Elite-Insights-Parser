<script>

    function parseCRDuration(crDurationStr) {
        if (!crDurationStr) {
            return null;
        }
        const regex = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?(?:(\d+)ms)?$/;
        const match = crDurationStr.match(regex);

        if (!match) {
            return null;
        }

        const [, hours, minutes, seconds, milliseconds] = match;

        const totalMs =
            (parseInt(hours || 0) * 60 * 60 * 1000) +
            (parseInt(minutes || 0) * 60 * 1000) +
            (parseInt(seconds || 0) * 1000) +
            parseInt(milliseconds || 0);

        return totalMs;
    }

    function getDefaultCombatReplayTime() {
        const timeS = EIUrlParams.get("crTime");
        if (!timeS) {
            const timeMS = EIUrlParams.get("crTimeMS")
            if (!timeMS) {
                const timeStr = EIUrlParams.get("crTimeStr")
                return parseCRDuration(timeStr);
            }
            return Math.max(parseInt(timeMS), 0);
        }
        return Math.max(parseFloat(timeS), 0.0) * 1000;
    }

    const MaxPhaseDepth = 2;

    // Last one breakbar, previous is remainings
    const PhaseDepthColors = ["#2d9400", "#fffb00", "#ffa800", "#ff2200", "#007bff"];

    function traversePhasesWithDepth(result, parentPhase, depth, remainingPhases, addedPhases) {
        if (depth > MaxPhaseDepth) {
            return depth;
        }
        let returnDepth = depth;
        if (parentPhase.subPhases) {
            const subPhases = parentPhase.subPhases;
            remainingPhases.forEach((phase) => {
                if (subPhases.indexOf(phase.id) > -1) {
                    result.push({
                        phase: phase,
                        depth: depth,
                        color: PhaseDepthColors[depth]
                    });
                    remainingPhases.delete(phase);
                    addedPhases.add(phase);
                    let finalDepth = traversePhasesWithDepth(result, phase, depth + 1, remainingPhases, addedPhases);
                    returnDepth = Math.max(finalDepth, returnDepth);
                }
            });
        }
        return returnDepth;
    }

    const crAnimationPhaseMixin = {
        data: function () {
            return {
                selectedPhaseId: -1,
            };
        },
        computed: {
            selectedPhase: function () {
                return logData.phases[this.selectedPhaseId];
            },
            hoveredPhase: function () {
                return logData.phases[this.hoveredPhaseId];
            },
            phases: function () {
                for (let i = 0; i < this.encounters.length; i++) {
                    const encounter = this.encounters[i];
                    if (encounter.active) {
                        const phase = logData.phases[encounter.index];
                        let phases = [];
                        if (phase.type === PhaseTypes.INSTANCE) {
                            if (IsMultiEncounterLog) {
                                return logData.phases.filter(x => x.type === PhaseTypes.ENCOUNTER || x.type === PhaseTypes.INSTANCE);
                            } else {
                                return logData.phases;
                            }
                        } else {
                            if (IsMultiEncounterLog) {
                                for (let j = 0; j < logData.phases.length; j++) {
                                    const subPhase = logData.phases[j];
                                    if (subPhase === phase || subPhase.encounterPhase === encounter.index) {
                                        phases.push(subPhase);
                                    }
                                }
                            } else {
                                return logData.phases;
                            }
                        }
                        return phases;
                    }
                }
                return logData.phases;
            },
            showNormalPhases: function () {
                return this.normalPhases.length > 1 || this.hasBreakbarPhases;
            },
            normalPhases: function () {
                return this.phases.filter(phase => !phase.breakbarPhase);
            },
            hasBreakbarPhases: function () {
                return this.phases.filter(phase => phase.breakbarPhase).length > 0;
            },
            phasesByDepth: function () {
                const phase0 = this.phases[0];
                const remainingPhases = new Set(this.phases.filter(phase => !phase.breakbarPhase));
                remainingPhases.delete(phase0);
                const addedPhases = new Set();
                addedPhases.add(phase0);
                let depth = 0;
                let result = [{
                    phase: phase0,
                    depth: depth,
                    color: PhaseDepthColors[depth]
                }];
                depth = traversePhasesWithDepth(result, phase0, depth + 1, remainingPhases, addedPhases);

                const breakbarPhaseColor = PhaseDepthColors[PhaseDepthColors.length - 1];
                const remainingPhaseColor = PhaseDepthColors[PhaseDepthColors.length - 2];

                const breakbarPhases = this.phases.filter(phase => phase.breakbarPhase);
                for (let i = 0; i < breakbarPhases.length; i++) {
                    result.push({
                        phase: breakbarPhases[i],
                        depth: remainingPhases.size > 0 ? depth + 1 : depth,
                        color: breakbarPhaseColor,
                    });
                }
                remainingPhases.forEach(phase => {
                    result.push({
                        phase: phase,
                        depth: depth,
                        color: remainingPhaseColor,
                    });
                });
                return result;
            },
            maxDepth: function () {
                const depths = this.phasesByDepth.map(phaseBloc => phaseBloc.depth);
                return Math.max(Math.max(...depths) + 1, 2);
            },
        },
        methods: {
            getPhaseData: function (id) {
                return logData.phases[id];
            },
            getPhaseName: function (phase) {
                return phase === this.encounterPhase ? phase.nameNoMode : phase.name;
            },
            getFormattedPhaseText: function (phase) {
                const offset = (this.range.min / 1000);
                var res = this.getPhaseName(phase) + ' (' + this.round3(phase.start - offset) + 's - ' + this.round3(phase.end - offset) + 's)';
                if (this.useAdvancedTimeline && this.animationData.selectedMechanic.name != null) {
                    res += ' | ' + this.animationData.selectedMechanic.name + ' (' + this.animationData.selectedMechanic.actorName + ')';
                }
                return res;
            },
        },
    }

    const crTimelineMixin = {
        data: function () {
            return {
                sliderDelimiter: {
                    min: -1,
                    max: -1,
                },
                hoveredPhaseId: null,
                draggingCursor: false,
                hoverTime: 0,
                isHoveringTimeline: false,
                lastTimelineClick: null,
                simpleTimelineTooltip: null,
            };
        },
        computed: {
            maxTime: function () {
                return this.range.max - this.range.min;
            },
            minTime: function () {
                return 0;
            },
            timelineWidth() {
                return 750 - 20; // remove p-2 padding (0.5rem = 8px x 2)
            },
            ticks() {
                const interval = this.getTickInterval();
                const ticks = [];

                // Ticks every set time based on max fight length
                let t;
                for (t = 0; t <= this.fightDuration; t += interval) {
                    ticks.push({
                        time: t,
                        x: this.timeToX(t),
                        label: this.formatTime(t),
                    });
                }

                // Always display the end tick
                const end = this.fightDuration;
                if (this.timeToX(end) - this.timeToX(t - interval) > 30) {
                    ticks.push({
                        time: end,
                        x: this.timeToX(end),
                        label: this.formatTime(end),
                    });
                }

                return ticks;
            },
            timelineColors() {
                if (this.light) {
                    return {
                        tick: "#343a40",
                        text: "#343a40",
                        cursor: "#ff6b6b",
                        background: "#f8f9fa",
                        backgroundBorder: "#dee2e6",
                        mechanic: "#ff8a9d",
                    };
                } else {
                    return {
                        tick: "#e6e6e6",
                        text: "#e6e6e6",
                        cursor: "#ff6b6b",
                        background: "#2C3035",
                        backgroundBorder: "#3e444c",
                        mechanic: "#ff8a9d",
                    };
                }
            },
            playerMechanicTicks() {
                return this.animationData.selectedMechanic.times.map(
                    time => ({
                        x: this.timeOffsetedToX(time / 1000),
                        time: time
                    })
                );
            },
        },
        methods: {
            getSliderGradient: function () {
                var startPercent, endPercent;
                if (this.sliderDelimiter.min === -1) {
                    startPercent = 0;
                    endPercent = 100;
                } else {
                    var max = this.maxTime;
                    startPercent = this.sliderDelimiter.min / max * 100;
                    endPercent = this.sliderDelimiter.max / max * 100;
                }
                return computeSliderGradient("#888888", "#F3F3F3", startPercent, endPercent);
            },
            timeToX(time) {
                time = time || this.minTime;
                var t = Math.max(this.minTime, Math.min(this.fightDuration, time));
                return (t / this.fightDuration) * this.timelineWidth;
            },
            timeOffsetedToX(time) {
                return this.timeToX(time - (this.range.min / 1000));
            },
            xToTime(x) {
                return (x / this.timelineWidth) * this.fightDuration;
            },
            getTickInterval() {
                const numberOfTicks = 6;
                const steps = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400]; // up to 24h, max evtc length accepted
                let interval = this.fightDuration / numberOfTicks;

                // pick smallest step >= interval
                for (let i = 0; i < steps.length; i++) {
                    if (interval <= steps[i]) {
                        return steps[i];
                    }
                }
            },
            getTickX(tick) {
                const pad = 10;

                if (tick.x <= pad) return tick.x + pad;
                if (tick.x >= this.timelineWidth - pad) return tick.x - pad;

                return tick.x;
            },
            formatTime(t) {
                const minutes = Math.floor(t / 60);
                const seconds = Math.floor(t % 60);
                return `${minutes}:${seconds.toString().padStart(2, "0")}`;
            },
            getTimeFromEvent(e) {
                const timeline = this.$refs.advancedTimeline;

                if (!timeline) {
                    return this.minTime;
                }

                const rect = timeline.getBoundingClientRect();
                const x = Math.max(0, Math.min(this.timelineWidth, e.clientX - rect.left));

                return this.xToTime(x);
            },
            onTimelineMouseMove(e) {
                this.hoverTime = this.getTimeFromEvent(e);
                this.isHoveringTimeline = true;

                if (e.buttons !== 0) {
                    this.resetHoveredPhase();
                    return;
                }

                const phase = this.getPhaseAtTimelinePosition(e);

                if (phase) {
                    this.hoverPhase(phase);
                } else {
                    this.resetHoveredPhase();
                }
            },
            onTimelineMouseLeave() {
                this.isHoveringTimeline = false;
                this.hoveredPhaseId = -1;
            },
            onTimelineMouseDown(e) {
                let time = this.getTimeFromEvent(e);
                this.updateTime(time * 1000);
                if (e.detail === 1) {
                    this.startDragCursor(e);
                }
            },
            getPhaseOpacity(phase) {
                if (phase.id === this.hoveredPhaseId) {
                    return 1.0;
                }
                return this.selectedPhaseId === phase.id ? 0.75 : 0.4;
            },
            hoverPhase(phase) {
                this.hoveredPhaseId = phase.id;
            },
            resetHoveredPhase() {
                this.hoveredPhaseId = -1;
            },
            onPhaseMouseDown(phase, e) {
                this.updateSelectedPhase(phase);
                const time = this.getTimeFromEvent(e);
                this.updateTime(time * 1000);
                this.startDragCursor(e);
            },
            onTimelineClick(e) {
                const phase = this.getPhaseAtTimelinePosition(e);

                if (phase) {
                    this.updatePhaseTime(phase);
                }
            },
            getPhaseAtTimelinePosition(e) {
                const timeline = this.$refs.advancedTimeline;

                if (!timeline) {
                    return null;
                }

                // Prefer the actual phase element when the click targets one.
                const layer = e.target.closest ? e.target.closest(".advanced-phase-layer") : null;

                if (layer) {
                    const phaseId = layer.getAttribute("data-phase-id");
                    const phaseBloc = this.phasesByDepth.find(item => String(item.phase.id) === phaseId);

                    if (phaseBloc) {
                        return phaseBloc.phase;
                    }
                }

                // The cursor can cover a phase, so hit-test its position as a fallback.
                const rect = timeline.getBoundingClientRect();
                const x = Math.max(0, Math.min(this.timelineWidth, e.clientX - rect.left));
                const y = e.clientY - rect.top;

                const candidates = this.phasesByDepth.filter(({ phase, depth }) => {
                    const left = this.timeOffsetedToX(phase.start);
                    const right = this.timeOffsetedToX(phase.end);
                    const top = 15 + depth * 10;

                    return x >= left - 2
                        && x <= right + 2
                        && y >= top
                        && y <= top + 10;
                });

                if (candidates.length === 0) {
                    return null;
                }

                // Prefer the most deeply nested phase when intervals overlap.
                candidates.sort((a, b) => b.depth - a.depth);

                return candidates[0].phase;
            },
            onPhaseClick(e) {
                if (e.detail > 1) {
                    return;
                }
            },
            startDragCursorFromLine(e) {
                if (e.detail > 1) {
                    return;
                }
                this.startDragCursor(e);
            },
            startDragCursor(e) {
                this.draggingCursor = true;
                window.addEventListener("mousemove", this.onDragCursor);
                window.addEventListener("mouseup", this.stopDragCursor);
            },
            onDragCursor(e) {
                if (!this.draggingCursor) return;
                let time = this.getTimeFromEvent(e);
                time = Math.max(this.minTime, Math.min(this.maxTime, time));
                this.updateTime(time * 1000);
            },
            stopDragCursor() {
                this.draggingCursor = false;
                window.removeEventListener("mousemove", this.onDragCursor);
                window.removeEventListener("mouseup", this.stopDragCursor);
            },
            onSimpleTimelineSliderMouseMove(e) {
                const slider = document.getElementById(this.htmlElementIDs.simpleTimelineID);

                if (this.useAdvancedTimeline || !slider || !slider.classList.contains("slider")) {
                    this.hideSimpleTimelineTooltip();
                    return;
                }

                const rect = slider.getBoundingClientRect();

                // Show the tooltip while the pointer is inside the slider on both axes.
                if (rect.width <= 0 ||
                    rect.height <= 0 ||
                    e.clientX < rect.left ||
                    e.clientX > rect.right ||
                    e.clientY < rect.top ||
                    e.clientY > rect.bottom) {
                    this.hideSimpleTimelineTooltip();
                    return;
                }

                if (!this.simpleTimelineTooltip) {
                    this.simpleTimelineTooltip = document.createElement("div");
                    this.simpleTimelineTooltip.className = "simple-timeline-time-tooltip";
                    document.body.appendChild(this.simpleTimelineTooltip);
                }

                const clampedX = Math.max(rect.left, Math.min(e.clientX, rect.right));
                const ratio = (clampedX - rect.left) / rect.width;
                const min = Number(slider.min) || 0;
                const max = Number(slider.max) || 0;
                const time = (min + ratio * (max - min)) / 1000;

                this.simpleTimelineTooltip.textContent = this.formatTime(time);

                const tooltipWidth = this.simpleTimelineTooltip.offsetWidth;
                const tooltipHalfWidth = tooltipWidth / 2;

                const tooltipX = Math.max(rect.left + tooltipHalfWidth, Math.min(clampedX, rect.right - tooltipHalfWidth));

                this.simpleTimelineTooltip.style.left = `${tooltipX}px`;
                this.simpleTimelineTooltip.style.top = `${rect.top - 24}px`;
                this.simpleTimelineTooltip.style.display = "block";
            },

            hideSimpleTimelineTooltip() {
                if (this.simpleTimelineTooltip) {
                    this.simpleTimelineTooltip.style.display = "none";
                }
            },
            getAdvancedTimelineStyle() {
                return {
                    width: this.timelineWidth + "px",
                    height: (10 * this.maxDepth + 30) + "px"
                };
            },
            getPhaseLayerStyle(phaseIndex) {
                return {
                    zIndex: phaseIndex + 2
                };
            },
            getPhaseHitboxStyle(phaseBloc) {
                const phase = phaseBloc.phase;
                const startX = this.timeOffsetedToX(phase.start);
                const endX = this.timeOffsetedToX(phase.end);

                return {
                    left: startX + "px",
                    top: (15 + phaseBloc.depth * 10) + "px",
                    width: (endX - startX) + "px"
                };
            },
            getPhaseLineStyle(phaseBloc) {
                const phase = phaseBloc.phase;
                const startX = this.timeOffsetedToX(phase.start);
                const endX = this.timeOffsetedToX(phase.end);

                return {
                    left: startX + "px",
                    top: (18 + phaseBloc.depth * 10) + "px",
                    width: (endX - startX) + "px",
                    backgroundColor: phaseBloc.color,
                    opacity: this.getPhaseOpacity(phase)
                };
            },
            getPhaseBoundaryStyle(phaseBloc, side) {
                const phase = phaseBloc.phase;
                const phaseTime = side === "start" ? phase.start : phase.end;

                return {
                    left: (this.timeOffsetedToX(phaseTime) - 1) + "px",
                    top: (15 + phaseBloc.depth * 10) + "px",
                    backgroundColor: phaseBloc.color,
                    opacity: this.getPhaseOpacity(phase)
                };
            },
            getCursorX() {
                return Math.round(this.timeOffsetedToX(this.time));
            },
            getCursorHitlineStyle() {
                return {
                    left: (this.getCursorX() - 5) + "px",
                    height: (10 * this.maxDepth + 30) + "px",
                    zIndex: this.phasesByDepth.length + 10
                };
            },
            getCursorLineStyle() {
                const color = this.timelineColors.cursor;

                return {
                    left: (this.getCursorX() - 1) + "px",
                    height: (10 * this.maxDepth + 30) + "px",
                    zIndex: this.phasesByDepth.length + 11,
                    backgroundImage:
                        "repeating-linear-gradient(to bottom, " +
                        color + " 0px, " +
                        color + " 4px, " +
                        "transparent 4px, transparent 6px)"
                };
            },
            getCursorCircleStyle() {
                return {
                    left: (this.getCursorX() - 5) + "px",
                    top: (10 * this.maxDepth + 20) + "px",
                    backgroundColor: this.timelineColors.cursor,
                    zIndex: this.phasesByDepth.length + 12
                };
            },
            getTickStyle(tick) {
                return {
                    left: tick.x + "px",
                    zIndex: this.phasesByDepth.length + 13
                };
            },
            getTickMarkStyle() {
                return {
                    backgroundColor: this.timelineColors.tick
                };
            },
            getTickLabelStyle(tick) {
                return {
                    left: (this.getTickX(tick) - tick.x) + "px",
                    color: this.timelineColors.text
                };
            },
            getMechanicTickStyle(tick) {
                return {
                    left: tick.x + "px",
                    zIndex: this.phasesByDepth.length + 14
                };
            },
            getMechanicTickMarkStyle() {
                return {
                    backgroundColor: this.timelineColors.mechanic
                };
            },
            getHoverTimeBoxStyle() {
                return {
                    left: (this.timeToX(this.hoverTime) - 18) + "px",
                    zIndex: this.phasesByDepth.length + 15
                };
            },
            getHoverTimeTextStyle() {
                return {
                    left: this.timeToX(this.hoverTime) + "px",
                    color: this.timelineColors.text,
                    zIndex: this.phasesByDepth.length + 16
                };
            },
            getPhaseTextStyle() {
                return {
                    width: this.timelineWidth + "px",
                    color: this.timelineColors.text,
                };
            },
            getPhaseDepth(phase) {
                const phaseBloc = this.phasesByDepth.find(item => item.phase.id === phase.id);
                return phaseBloc ? phaseBloc.depth : 0;
            },
        },
    };

    Vue.component("combat-replay-animation-control-component", {
        props: ["time", "light", "animated", "range"],
        template: `${template}`,
        mixins: [crAnimationPhaseMixin, crTimelineMixin, encounterPhaseComponent, numberComponent, UIIconsComponent, localStoragedSettings({
            useAdvancedTimeline: {
                defaultValue: !isTouchDevice && getValueFromLocalStorage("useAdvancedTimeline") !== "false",
                cb: (iOnOff) => {
                    if (iOnOff) {
                        this.hideSimpleTimelineTooltip();
                    }
                }
            }
        })],
        data: function () {
            return {
                isTouchDevice: isTouchDevice,
                backwards: false,
                animationData: reactiveAnimationData,
                panStep: 10,
                zoomEvent: null,
                panEvent: null,
            };
        },
        watch: {
            encounters: {
                handler: function () {
                    // make sure DOM is attached
                    if (animator.mainCanvas) {
                        const encounterPhase = this.encounterPhase;
                        this.updateAnimatorTimes(encounterPhase);
                        this.resetViewpoint();
                        this.updateSelectedPhase(this.phases[0]);
                    }
                },
                deep: true
            },
        },
        mounted() {
            animator.attachDOM(this.htmlElementIDs.mainCanvasID, this.htmlElementIDs.bgCanvasID, this.htmlElementIDs.pickCanvasID);
            const encounterPhase = this.encounterPhase;
            this.updateAnimatorTimes(encounterPhase);
            this.resetViewpoint();
            this.updateSelectedPhase(this.normalPhases[0]);
            animationControlComponent = this;
            const defaultCombatReplayTime = getDefaultCombatReplayTime();
            if (defaultCombatReplayTime !== null) {
                const startTime = defaultCombatReplayTime - encounterPhase.start * 1000;
                if (startTime >= 0 && startTime <= (encounterPhase.end - encounterPhase.start) * 1000) {
                    this.updateTime(startTime);
                }
            }
            $('#zoom-step-input').on("input ", function () {
                animator.zoomStep = (Number.parseFloat($(this).val()) / 500) + 1;
            });
        },
        beforeDestroy() {
            if (this.simpleTimelineTooltip) {
                this.simpleTimelineTooltip.remove();
                this.simpleTimelineTooltip = null;
            }
            this.stopPan();
            this.stopZoom();
        },
        computed: {


            canvasSize: function () {
                return {
                    x: crData.sizes[0],
                    y: crData.sizes[1]
                };
            },
            htmlElementIDs: function () {
                return {
                    mainCanvasID: "main-canvas",
                    bgCanvasID: "bg-canvas",
                    pickCanvasID: "picking-canvas",
                    simpleTimelineID: 'simple-timeline'
                };
            },

            fightDuration() {
                return (this.maxTime - this.minTime) / 1000;
            },

            isMechanicSelected() {
                return this.animationData.selectedMechanic.name != null && this.animationData.selectedMechanic.actorId != null;
            },
            hoveredActor() {
                return this.animationData.hoveredActor;
            },
        },
        updated() {
            animator._updateAgentTooltipPopper();
        },
        methods: {
            updateAnimatorTimes(encounterPhase) {
                animator.updateRange(encounterPhase);
                this.updatePhaseTime(encounterPhase);
                animator._reselectIfEnglobed();
            },

            toggleBackwards: function () {
                this.backwards = animator.toggleBackwards();
            },
            resetViewpoint: function () {
                animator.resetViewpoint(this.normalPhases[0].eiid);
            },
            panView: function (dx, dy) {
                animator.pan(dx, dy);
                if (!this.panEvent) {
                    this.panEvent = setInterval(() => {
                        this.panView(dx, dy);
                    }, 100);
                }
            },
            stopPan: function () {
                if (this.panEvent) {
                    clearInterval(this.panEvent);
                    this.panEvent = null;
                }
            },
            zoomIn: function () {
                animator.zoomCenter(3);
                if (!this.zoomEvent) {
                    this.zoomEvent = setInterval(() => {
                        this.zoomIn();
                    }, 100);
                }
            },
            zoomOut: function () {
                animator.zoomCenter(-3);
                if (!this.zoomEvent) {
                    this.zoomEvent = setInterval(() => {
                        this.zoomOut();
                    }, 100);
                }
            },
            stopZoom: function () {
                if (this.zoomEvent) {
                    clearInterval(this.zoomEvent);
                    this.zoomEvent = null;
                }
            },
            toggleAnimate: function () {
                animator.toggleAnimate();
            },
            restartAnimate: function () {
                animator.restartAnimate();
            },
            updateTime: function (value) {
                const offset = this.range.min;
                const t = parseInt(value) + offset;
                animator.updateTime(t);
            },
            resetMechanic: function () {
                this.isMechanicSelected = false;

                this.animationData.selectedMechanic = {
                    actorId: null,
                    actorName: null,
                    name: null,
                    times: [],
                };
            },
            updateSelectedPhase: function (phase) {
                this.selectedPhaseId = phase.id;
                const min = phase.start * 1000;
                const max = phase.end * 1000;
                const offset = this.range.min;
                this.sliderDelimiter.min = min - offset;
                this.sliderDelimiter.max = max - offset;
            },
            updatePhaseTime: function (phase) {
                this.updateSelectedPhase(phase);
                const min = phase.start * 1000;
                const offset = this.range.min;
                this.updateTime(min - offset);
            },
            updateInputTime: function (value) {
                const offset = this.range.min;
                animator.updateInputTime(value, offset);
            },

        },
    });
</script>
