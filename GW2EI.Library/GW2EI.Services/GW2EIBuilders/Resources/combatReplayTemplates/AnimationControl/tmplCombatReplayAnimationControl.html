<template>
    <div>
        <div class="d-flex align-items-center justify-content-center mb-1">
            <ul v-if="showNormalPhases && isTouchDevice"

                <label class="custom-control-label" for="timelineModeSwitch">Advanced timeline</label>

        </div>
        <div class="d-flex mt-1">

                <canvas class="replay top-0 left-0" :width="canvasSize.x + 'px'" :height="canvasSize.y + 'px'" :id="htmlElementIDs.bgCanvasID"></canvas>

                <div id="combat-replay-agent-tooltip" class="tooltip bs-tooltip-auto" :style="{ 'opacity': hoveredActor ? '1.0' : '0.0' }"
                     style="pointer-events: none; will-change: transform;">
                    <div class="arrow"></div>

                </div>
                <div class="btn btn-small opacity-90 m-2 scale-info" :class="{ 'btn-dark': !light, 'btn-light': light }">
                    <div class="d-flex flex-column justify-content-center align-items-center scale-container">
                        <div class="scale-ruler">
                            <div class="scale-line-container">
                                <div class="scale-end-label scale-end-label-left">0</div>
                                <div class="scale-end-label scale-end-label-right">
                                    {{ formatterCache.twoTwo.format(animationData.scaleUnits)}}
                                </div>
                                <div class="scale-line"></div>
                                <div class="scale-marker scale-marker-left"></div>
                                <div class="scale-marker scale-marker-right"></div>

                        </div>
                        <div class="coordinates">
                            <div class="coordinate-row">
                                <span class="coordinate-label">X</span>
                                <span class="coordinate-value">
                                    {{formatterCache.twoTwo.format(animationData.gameCoordinates.x)}}
                                </span>
                            </div>
                            <div class="coordinate-row">
                                <span class="coordinate-label">Y</span>
                                <span class="coordinate-value">
                                    {{formatterCache.twoTwo.format(animationData.gameCoordinates.y)}}

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="timeline mt-1 rounded" ref="timeline" :style="{
                backgroundColor: timelineColors.background,
                border: '1px solid ' + timelineColors.backgroundBorder
            }">
            <svg v-if="useAdvancedTimeline" ref="svg"
                 :width="timelineWidth"
                 :height="20 + 10 * maxDepth + 30"
                 @mousemove="onTimelineMouseMove"
                 @mouseleave="onTimelineMouseLeave">
                <g class="no-user-select">
                    <!-- Invisible cursor scroll line -->
                    <rect x="0"
                          y="0"
                          :width="timelineWidth"
                          :height="10 * maxDepth + 30"
                          fill="transparent"
                          style="cursor: pointer;"
                          @mousedown="onTimelineMouseDown" />

                    <g v-for="phaseBloc in phasesByDepth">
                        <!-- Invisible grab -->
                        <line :x1="timeOffsetedToX(phaseBloc.phase.start)" :y1="20 + phaseBloc.depth * 10"
                              :x2="timeOffsetedToX(phaseBloc.phase.end)" :y2="20 + phaseBloc.depth * 10"
                              stroke="transparent"
                              stroke-width="10"
                              stroke-linecap="butt"
                              @mouseenter="hoverPhase(phaseBloc.phase)"
                              @mouseleave="resetHoveredPhase"
                              @mousedown="onPhaseMouseDown(phaseBloc.phase, $event)"
                              @click="onPhaseClick(phaseBloc.phase, $event)"
                              @mouseup="onPhaseMouseUp(phaseBloc.phase, $event)" />

                        <line :x1="timeOffsetedToX(phaseBloc.phase.start)" :y1="20 + phaseBloc.depth * 10"
                              :x2="timeOffsetedToX(phaseBloc.phase.end)" :y2="20 + phaseBloc.depth * 10"
                              :stroke="phaseBloc.color"
                              stroke-width="4"
                              stroke-linecap="butt"
                              :opacity="getPhaseOpacity(phaseBloc.phase)"
                              style="pointer-events: none;" />

                        <line :x1="timeOffsetedToX(phaseBloc.phase.start)" :y1="20 - 5 + phaseBloc.depth * 10"
                              :x2="timeOffsetedToX(phaseBloc.phase.start)" :y2="20 + 5 + phaseBloc.depth * 10"
                              :stroke="phaseBloc.color"
                              stroke-width="2"
                              :opacity="getPhaseOpacity(phaseBloc.phase)"
                              @mouseenter="hoverPhase(phaseBloc.phase)"
                              @mouseleave="resetHoveredPhase"
                              @mousedown="onPhaseMouseDown(phaseBloc.phase, $event)"
                              @click="onPhaseClick(phaseBloc.phase, $event)"
                              @mouseup="onPhaseMouseUp(phaseBloc.phase, $event)" />

                        <line :x1="timeOffsetedToX(phaseBloc.phase.end)" :y1="20 - 5 + phaseBloc.depth * 10"
                              :x2="timeOffsetedToX(phaseBloc.phase.end)" :y2="20 + 5 + phaseBloc.depth * 10"
                              :stroke="phaseBloc.color"
                              stroke-width="2"
                              :opacity="getPhaseOpacity(phaseBloc.phase)"
                              @mouseenter="hoverPhase(phaseBloc.phase)"
                              @mouseleave="resetHoveredPhase"
                              @mousedown="onPhaseMouseDown(phaseBloc.phase, $event)"
                              @click="onPhaseClick(phaseBloc.phase, $event)"
                              @mouseup="onPhaseMouseUp(phaseBloc.phase, $event)" />
                    </g>

                    <!-- Drag cursor, larger for easier grab -->
                    <line id="large-line-drag"
                          :x1="timeOffsetedToX(time)" y1="0"
                          :x2="timeOffsetedToX(time)" :y2="10 * maxDepth + 30"
                          stroke="transparent" stroke-width="10"
                          style="pointer-events: stroke; cursor: grab;"
                          @mousedown="startDragCursorFromLine" />
                    <!-- The cursor visual -->
                    <line :x1="timeOffsetedToX(time)" y1="0"
                          :x2="timeOffsetedToX(time)" :y2="10 * maxDepth + 30"
                          :stroke="timelineColors.cursor" stroke-width="2" stroke-dasharray="4 2"
                          style="pointer-events: none;" />
                    <!-- Cursor circle -->
                    <circle :cx="timeOffsetedToX(time)"
                            :cy="10 * maxDepth + 25"
                            r="5"
                            :fill="timelineColors.cursor"
                            style="cursor: grab; pointer-events: all;"
                            @mousedown="startDragCursor" />

                    <!-- Fixed time ticks -->
                    <g v-for="tick in ticks">
                        <line :x1="tick.x" y1="15" :x2="tick.x" y2="25"
                              :stroke="timelineColors.tick" />

                        <text :x="getTickX(tick)" y="10"
                              font-size="10"
                              text-anchor="middle"
                              :fill="timelineColors.text">
                            {{ tick.label }}
                        </text>
                    </g>

                    <!-- Mechanics ticks -->
                    <g v-for="tick in playerMechanicTicks">
                        <line :x1="tick.x" y1="15" :x2="tick.x" y2="25"
                              :stroke="timelineColors.mechanic" />
                        <!-- Top -->
                        <line :x1="tick.x - 1" y1="15" :x2="tick.x + 1" y2="15"
                              :stroke="timelineColors.mechanic" />
                        <!-- Bottom -->
                        <line :x1="tick.x - 1" y1="25" :x2="tick.x + 1" y2="25"
                              :stroke="timelineColors.mechanic" />
                    </g>

                    <!-- Moving time -->
                    <g v-if="isHoveringTimeline">
                        <rect :x="timeToX(hoverTime) - 18"
                              y="-3"
                              width="36"
                              height="16"
                              rx="3"
                              fill="black"
                              opacity="0.5"
                              pointer-events="none" />
                        <text :x="timeToX(hoverTime)" y="10"
                              font-size="10"
                              text-anchor="middle"
                              :fill="timelineColors.text"
                              style="pointer-events: none; font-weight: 600;">
                            {{ formatTime(hoverTime) }}
                        </text>
                    </g>
                </g>

                <text v-if="hoveredPhase || selectedPhase"
                      :x="timelineWidth / 2"
                      :y="10 * maxDepth + 45"
                      text-anchor="middle"
                      :fill="timelineColors.text"
                      font-size="12"
                      style="font-weight: 500; pointer-events: none;">
                    {{ getFormattedPhaseText(hoveredPhase || selectedPhase) }}
                </text>
            </svg>

            <div v-else class="simple-timeline-container my-1">
                <div class="simple-timeline-ticks"
                     :style="{ color: timelineColors.text }">
                    <span v-for="tick in ticks" :key="tick.time"
                          class="simple-timeline-tick" :style="{left: (getTickX(tick) / timelineWidth * 100) + '%'}">
                        {{ tick.label }}
                    </span>
                </div>
                <div class="d-flex justify-content-center slidercontainer my-1">
                    <input style="min-width: 400px;" @input="updateTime($event.target.value)" type="range"
                           @mousemove="onSimpleTimelineSliderMouseMove" @mouseleave="hideSimpleTimelineTooltip"
                           :min="minTime" :max="maxTime" :value="time * 1000 - range.min"
                           class="slider" :id="htmlElementIDs.simpleTimelineID"
                           :style="{'background': getSliderGradient()}">
                    <div v-if="selectedPhase" class="cr-slide-delimiter text-center" :style="{ width: (timelineWidth + 20) + 'px' }">
                        {{ getFormattedPhaseText(selectedPhase) }}
                    </div>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-center">
                <label class="mr-auto">
                    <input style="width: 100px;" class="form-control d-inline h-auto text-right" type="number" step="0.001"
                           data-original-title="Time" :value="(time - range.min / 1000.0).toFixed(3)"
                           @input="updateInputTime($event.target.value);">
                </label>

                <div @click="toggleAnimate();" style="width: 80px;"
                     class="btn btn-small"
                     :class="{'btn-dark': !light, 'btn-light': light}"
                     data-original-title="Play / pause animation">
                    {{ animated ? "&#9208 Pause" : "&#9654 Play" }}
                </div>
                <div @click="restartAnimate();" class="btn btn-small"
                     :class="{'btn-dark': !light, 'btn-light': light}"
                     data-original-title="Reset back to start">
                    &#8617;&#65039; Restart
                </div>
                <div @click="toggleBackwards();" style="width: 104px;"
                     class="btn btn-small"
                     :class="{'btn-dark': !light, 'btn-light': light}"
                     data-original-title="Play animation backwards/forwards">
                    {{ backwards ? "&#9654; Forwards" : "&#9664; Backwards" }}

                </div>

                <combat-replay-time-speed-picker-component />
            </div>
        </div>
        <div class="replay-controls-panel mt-1 rounded" ref="canvasControls">
            <div class="replay-reset-controls">
                <button type="button" class="btn btn-small" :class="{ 'btn-dark': !light, 'btn-light': light }"
                        @click="resetViewpoint()" data-original-title="Reset canvas position">
                    &#9974; Reset Viewpoint
                </button>
                <button type="button" class="btn btn-small" :class="{ 'btn-dark': !light, 'btn-light': light }"
                        @click="resetMechanic()" data-original-title="Deselect mechanic">
                    &#128295; Reset Mechanic
                </button>
            </div>
            <div class="replay-movement-controls">
                <div class="movement-arrow-grid">
                    <span></span>
                    <button type="button" class="btn btn-small movement-button" :class="{ 'btn-dark': !light, 'btn-light': light }"
                            data-original-title="Move up" @click.stop="panView(0, panStep)">
                        &#9651;
                    </button>
                    <span></span>
                    <button type="button" class="btn btn-small movement-button" :class="{ 'btn-dark': !light, 'btn-light': light }"
                            data-original-title="Move left" @click.stop="panView(panStep, 0)">
                        &#9665;
                    </button>
                    <button type="button" class="btn btn-small movement-button" :class="{ 'btn-dark': !light, 'btn-light': light }"
                            data-original-title="Move down" @click.stop="panView(0, -panStep)">
                        &#9661;
                    </button>
                    <button type="button" class="btn btn-small movement-button" :class="{ 'btn-dark': !light, 'btn-light': light }"
                            data-original-title="Move right" @click.stop="panView(-panStep, 0)">
                        &#9655;
                    </button>
                </div>
            </div>
            <input id="pan-step-input" type="number" class="form-control" data-original-title="Pixels moved per click"
                   style="width: 75px; text-align: center; padding: 2px; flex-shrink: 0;"
                   min="1" step="1" v-model.number="panStep">
            <div class="replay-zoom-controls">
                <div class="zoom-controls">
                    <button type="button" class="btn btn-small zoom-button" :class="{ 'btn-dark': !light, 'btn-light': light }"
                            data-original-title="Zoom in" @click.stop="zoomIn">
                        +
                    </button>
                    <button type="button" class="btn btn-small zoom-button" :class="{ 'btn-dark': !light, 'btn-light': light }"
                            data-original-title="Zoom out" @click.stop="zoomOut">
                        -
                    </button>
                </div>
            </div>
                <input id="zoom-step-input" type="number" data-original-title="Zoom multiplier per step"
                       min="1.01" step="0.01" max="2"
                       class="form-control" style="width: 75px; text-align: center; padding: 2px;"
                       v-model="zoomStep" @input="handleZoomStep($event)" @change="handleZoomStep($event)">
        </div>
    </div>
</template>
<script>

    function parseCRDuration(crDurationStr) {
        if (!crDurationStr) {
            return null;
        }
        const regex = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?(?:(\d+)ms)?$/;
        const match = crDurationStr.match(regex);

        if (!match) {
            return null;
        }

        const [, hours, minutes, seconds, milliseconds] = match;

        const totalMs =
            (parseInt(hours || 0) * 60 * 60 * 1000) +
            (parseInt(minutes || 0) * 60 * 1000) +
            (parseInt(seconds || 0) * 1000) +
            parseInt(milliseconds || 0);

        return totalMs;
    }

    function getDefaultCombatReplayTime() {
        const timeS = EIUrlParams.get("crTime");
        if (!timeS) {
            const timeMS = EIUrlParams.get("crTimeMS")
            if (!timeMS) {
                const timeStr = EIUrlParams.get("crTimeStr")
                return parseCRDuration(timeStr);
            }
            return Math.max(parseInt(timeMS), 0);
        }
        return Math.max(parseFloat(timeS), 0.0) * 1000;
    }

    const MaxPhaseDepth = 2;

    // Last one breakbar, previous is remainings
    const PhaseDepthColors = ["#2d9400", "#fffb00", "#ffa800", "#ff2200", "#007bff"];

    function traversePhasesWithDepth(result, parentPhase, depth, remainingPhases, addedPhases) {
        if (depth > MaxPhaseDepth) {
            return depth;
        }
        let returnDepth = depth;
        if (parentPhase.subPhases) {
            const subPhases = parentPhase.subPhases;
            remainingPhases.forEach((phase) => {
                if (subPhases.indexOf(phase.id) > -1) {
                    result.push({
                        phase: phase,
                        depth: depth,
                        color: PhaseDepthColors[depth]
                    });
                    remainingPhases.delete(phase);
                    addedPhases.add(phase);
                    let finalDepth = traversePhasesWithDepth(result, phase, depth + 1, remainingPhases, addedPhases);
                    returnDepth = Math.max(finalDepth, returnDepth);
                }
            });
        }
        return returnDepth;
    }

    Vue.component("combat-replay-animation-control-component", {
        props: ["time", "light", "animated", "range"],
        template: `${template}`,
        mixins: [encounterPhaseComponent, numberComponent, UIIconsComponent, localStoragedSettings({
            useAdvancedTimeline: {
                defaultValue: !isTouchDevice && getValueFromLocalStorage("useAdvancedTimeline") !== "false",
                cb: (iOnOff) => {
                    if (iOnOff) {
                        this.hideSimpleTimelineTooltip();
                    }
                }
            }
        })],
        data: function () {
            return {
                isTouchDevice: isTouchDevice,
                backwards: false,
                sliderDelimiter: {
                    min: -1,
                    max: -1,
                },
                selectedPhaseId: -1,
                hoveredPhaseId: null,
                draggingCursor: false,
                hoverTime: 0,
                isHoveringTimeline: false,
                clickThroughDragCursor: false,
                blockDragCursor: false,
                phaseDoubleClickTimeout: null,
                dragThroughPhaseBlockTimeout: null,
                simpleTimelineTooltip: null,
                animationData: reactiveAnimationData,
                zoomStep: String(zoomStep),
                panStep: 10,
            };
        },
        watch: {
            encounters: {
                handler: function () {
                    // make sure DOM is attached
                    if (animator.mainCanvas) {
                        const encounterPhase = this.encounterPhase;
                        this.updateAnimatorTimes(encounterPhase);
                        this.resetViewpoint();
                        this.selectedPhaseId = this.phases[0].id;
                    }
                },
                deep: true
            },
        },
        mounted() {
            animator.attachDOM(this.htmlElementIDs.mainCanvasID, this.htmlElementIDs.bgCanvasID, this.htmlElementIDs.pickCanvasID);
            const encounterPhase = this.encounterPhase;
            this.updateAnimatorTimes(encounterPhase);
            this.resetViewpoint();
            this.selectedPhaseId = this.normalPhases[0].id;
            animationControlComponent = this;
            const defaultCombatReplayTime = getDefaultCombatReplayTime();
            if (defaultCombatReplayTime !== null) {
                const startTime = defaultCombatReplayTime - encounterPhase.start * 1000;
                if (startTime >= 0 && startTime <= (encounterPhase.end - encounterPhase.start) * 1000) {
                    this.updateTime(startTime);
                }
            }
        },
        beforeDestroy() {
            if (this.simpleTimelineTooltip) {
                this.simpleTimelineTooltip.remove();
                this.simpleTimelineTooltip = null;
            }
        },
        computed: {
            selectedPhase: function () {
                return logData.phases[this.selectedPhaseId];
            },
            hoveredPhase: function () {
                return logData.phases[this.hoveredPhaseId];
            },
            phases: function () {
                for (let i = 0; i < this.encounters.length; i++) {
                    const encounter = this.encounters[i];
                    if (encounter.active) {
                        const phase = logData.phases[encounter.index];
                        let phases = [];
                        if (phase.type === PhaseTypes.INSTANCE) {
                            if (IsMultiEncounterLog) {
                                return logData.phases.filter(x => x.type === PhaseTypes.ENCOUNTER || x.type === PhaseTypes.INSTANCE);
                            } else {
                                return logData.phases;
                            }
                        } else {
                            if (IsMultiEncounterLog) {
                                for (let j = 0; j < logData.phases.length; j++) {
                                    const subPhase = logData.phases[j];
                                    if (subPhase === phase || subPhase.encounterPhase === encounter.index) {
                                        phases.push(subPhase);
                                    }
                                }
                            } else {
                                return logData.phases;
                            }
                        }
                        return phases;
                    }
                }
                return logData.phases;
            },
            showNormalPhases: function () {
                return this.normalPhases.length > 1 || this.hasBreakbarPhases;
            },
            normalPhases: function () {
                return this.phases.filter(phase => !phase.breakbarPhase);
            },
            hasBreakbarPhases: function () {
                return this.phases.filter(phase => phase.breakbarPhase).length > 0;
            },
            phasesByDepth: function () {
                const phase0 = this.phases[0];
                const remainingPhases = new Set(this.phases.filter(phase => !phase.breakbarPhase));
                remainingPhases.delete(phase0);
                const addedPhases = new Set();
                addedPhases.add(phase0);
                let depth = 0;
                let result = [{
                    phase: phase0,
                    depth: depth,
                    color: PhaseDepthColors[depth]
                }];
                depth = traversePhasesWithDepth(result, phase0, depth + 1, remainingPhases, addedPhases);

                const breakbarPhaseColor = PhaseDepthColors[PhaseDepthColors.length - 1];
                const remainingPhaseColor = PhaseDepthColors[PhaseDepthColors.length - 2];

                const breakbarPhases = this.phases.filter(phase => phase.breakbarPhase);
                for (let i = 0; i < breakbarPhases.length; i++) {
                    result.push({
                        phase: breakbarPhases[i],
                        depth: remainingPhases.size > 0 ? depth + 1 : depth,
                        color: breakbarPhaseColor,
                    });
                }
                remainingPhases.forEach(phase => {
                    result.push({
                        phase: phase,
                        depth: depth,
                        color: remainingPhaseColor,
                    });
                });
                return result;
            },
            maxDepth: function () {
                const depths = this.phasesByDepth.map(phaseBloc => phaseBloc.depth);
                return Math.max(Math.max(...depths) + 1, 2);
            },
            maxTime: function () {
                return this.range.max - this.range.min;
            },
            minTime: function () {
                return 0;
            },
            canvasSize: function () {
                return {
                    x: crData.sizes[0],
                    y: crData.sizes[1]
                };
            },
            htmlElementIDs: function () {
                return {
                    mainCanvasID: "main-canvas",
                    bgCanvasID: "bg-canvas",
                    pickCanvasID: "picking-canvas",
                    simpleTimelineID: 'simple-timeline'
                };
            },
            timelineWidth() {
                return 750 - 20; // remove p-2 padding (0.5rem = 8px x 2)
            },
            fightDuration() {
                return (this.maxTime - this.minTime) / 1000;
            },
            ticks() {
                const interval = this.getTickInterval();
                const ticks = [];

                // Ticks every set time based on max fight length
                let t;
                for (t = 0; t <= this.fightDuration; t += interval) {
                    ticks.push({
                        time: t,
                        x: this.timeToX(t),
                        label: this.formatTime(t),
                    });
                }

                // Always display the end tick
                const end = this.fightDuration;
                if (this.timeToX(end) - this.timeToX(t - interval) > 30) {
                    ticks.push({
                        time: end,
                        x: this.timeToX(end),
                        label: this.formatTime(end),
                    });
                }

                return ticks;
            },
            timelineColors() {
                if (this.light) {
                    return {
                        tick: "#343a40",
                        text: "#343a40",
                        cursor: "#ff6b6b",
                        background: "#f8f9fa",
                        backgroundBorder: "#dee2e6",
                        mechanic: "#ff8a9d",
                    };
                } else {
                    return {
                        tick: "#e6e6e6",
                        text: "#e6e6e6",
                        cursor: "#ff6b6b",
                        background: "#2C3035",
                        backgroundBorder: "#3e444c",
                        mechanic: "#ff8a9d",
                    };
                }
            },
            playerMechanicTicks() {
                return this.animationData.selectedMechanic.times.map(
                    time => ({
                        x: this.timeOffsetedToX(time / 1000),
                        time: time
                    })
                );
            },
            isMechanicSelected() {
                return this.animationData.selectedMechanic.name != null && this.animationData.selectedMechanic.actorId != null;
            },
            hoveredActor() {
                return this.animationData.hoveredActor;
            },
        },
        updated() {
            animator._updateAgentTooltipPopper();
        },
        methods: {
            updateAnimatorTimes(encounterPhase) {
                animator.updateRange(encounterPhase);
                this.updatePhaseTime(encounterPhase);
                animator._reselectIfEnglobed();
            },
            getSliderGradient: function () {
                var startPercent, endPercent;
                if (this.sliderDelimiter.min === -1) {
                    startPercent = 0;
                    endPercent = 100;
                } else {
                    var max = this.maxTime;
                    startPercent = this.sliderDelimiter.min / max * 100;
                    endPercent = this.sliderDelimiter.max / max * 100;
                }
                return computeSliderGradient("#888888", "#F3F3F3", startPercent, endPercent);
            },
            getPhaseData: function (id) {
                return logData.phases[id];
            },
            toggleBackwards: function () {
                this.backwards = animator.toggleBackwards();
            },
            resetViewpoint: function () {
                animator.resetViewpoint(this.normalPhases[0].eiid);
            },
            panView: function (dx, dy) {
                animator.panByPixels(dx, dy);
            },
            zoomIn: function () {
                animator.zoomIn();
            },
            zoomOut: function () {
                animator.zoomOut();
            },
            handleZoomStep(event) {
                const parsed = Number(event.target.value);

                if (Number.isFinite(parsed) && parsed >= 1.01) {
                    zoomStep = parsed;
                } else if (event.type === "change") {
                    // Restore the last valid value when editing finishes.
                    this.zoomStep = zoomStep;
                }
            },
            toggleAnimate: function () {
                animator.toggleAnimate();
            },
            restartAnimate: function () {
                animator.restartAnimate();
            },
            updateTime: function (value) {
                const offset = this.range.min;
                const t = parseInt(value) + offset;
                animator.updateTime(t);
            },
            getPhaseName: function (phase) {
                return phase === this.encounterPhase ? phase.nameNoMode : phase.name;
            },
            getFormattedPhaseText: function (phase) {
                const offset = (this.range.min / 1000);
                var res = this.getPhaseName(phase) + ' (' + this.round3(phase.start - offset) + 's - ' + this.round3(phase.end - offset) + 's)';
                if (this.animationData.selectedMechanic.name != null) {
                    res += ' | ' + this.animationData.selectedMechanic.name + ' (' + this.animationData.selectedMechanic.actorName + ')';
                }
                return res;
            },
            resetMechanic: function () {
                this.isMechanicSelected = false;

                this.animationData.selectedMechanic = {
                    actorId: null,
                    actorName: null,
                    name: null,
                    times: [],
                };
            },
            updatePhaseTime: function (phase) {
                this.selectedPhaseId = phase.id;
                var min = phase.start * 1000;
                var max = phase.end * 1000;
                var name = this.getPhaseName(phase);
                const offset = this.range.min;
                this.sliderDelimiter.min = min - offset;
                this.sliderDelimiter.max = max - offset;
                this.updateTime(min - offset);
            },
            updateInputTime: function (value) {
                const offset = this.range.min;
                animator.updateInputTime(value, offset);
            },
            timeToX(time) {
                time = time || this.minTime;
                var t = Math.max(this.minTime, Math.min(this.fightDuration, time));
                return (t / this.fightDuration) * this.timelineWidth;
            },
            timeOffsetedToX(time) {
                return this.timeToX(time - (this.range.min / 1000));
            },
            xToTime(x) {
                return (x / this.timelineWidth) * this.fightDuration;
            },
            getTickInterval() {
                const numberOfTicks = 6;
                const steps = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400]; // up to 24h, max evtc length accepted
                let interval = this.fightDuration / numberOfTicks;

                // pick smallest step >= interval
                for (let i = 0; i < steps.length; i++) {
                    if (interval <= steps[i]) {
                        return steps[i];
                    }
                }
            },
            getTickX(tick) {
                const pad = 10;

                if (tick.x <= pad) return tick.x + pad;
                if (tick.x >= this.timelineWidth - pad) return tick.x - pad;

                return tick.x;
            },
            formatTime(t) {
                const minutes = Math.floor(t / 60);
                const seconds = Math.floor(t % 60);
                return `${minutes}:${seconds.toString().padStart(2, "0")}`;
            },
            getTimeFromEvent(e) {
                const rect = this.$refs.svg.getBoundingClientRect();
                const x = Math.max(0, Math.min(this.timelineWidth, e.clientX - rect.left));
                return this.xToTime(x);
            },
            onTimelineMouseMove(e) {
                this.hoverTime = this.getTimeFromEvent(e);
                this.isHoveringTimeline = true;
            },
            onTimelineMouseLeave() {
                this.isHoveringTimeline = false;
                this.hoveredPhaseId = -1;
            },
            onTimelineMouseDown(e) {
                let time = this.getTimeFromEvent(e);
                this.updateTime(time * 1000);
                if (e.detail === 1) {
                    this.startDragCursor(e);
                }
            },
            getPhaseOpacity(phase) {
                if (phase.id === this.hoveredPhaseId) {
                    return 1.0;
                }
                return this.selectedPhaseId === phase.id ? 0.75 : 0.4;
            },
            hoverPhase(phase) {
                this.hoveredPhaseId = phase.id;
                if (this.clickThroughDragCursor) {
                    this.clickThroughDragCursor = false;
                    this.updatePhaseTime(phase);
                }
            },
            resetHoveredPhase() {
                this.hoveredPhaseId = -1;
            },
            clearPhaseMouseEvents() {
                clearTimeout(this.dragThroughPhaseBlockTimeout);
                this.dragThroughPhaseBlockTimeout = null;
                clearTimeout(this.phaseDoubleClickTimeout);
                this.phaseDoubleClickTimeout = null;
            },
            onPhaseMouseDown(phase, e) {
                if (this.phaseDoubleClickTimeout) {
                    return;
                }
                this.selectedPhaseId = phase.id;
                this.dragThroughPhaseBlockTimeout = this.dragThroughPhaseBlockTimeout || setTimeout(() => {
                    this.clearPhaseMouseEvents();
                    let time = this.getTimeFromEvent(e);
                    this.updateTime(time * 1000);
                    this.startDragCursor(e);
                }, 150);
            },
            onPhaseClick(phase, e) {
                if (this.phaseDoubleClickTimeout) {
                    this.clearPhaseMouseEvents();
                    this.updatePhaseTime(phase);
                } else {
                    this.phaseDoubleClickTimeout = setTimeout(() => {
                        this.clearPhaseMouseEvents();
                        let time = this.getTimeFromEvent(e);
                        this.updateTime(time * 1000);
                        this.blockDragCursor = true;
                        setTimeout(() => {
                            this.blockDragCursor = false
                        }, 150);
                    }, 200);
                }
            },
            onPhaseMouseUp(phase, e) {
                clearTimeout(this.dragThroughPhaseBlockTimeout);
                this.dragThroughPhaseBlockTimeout = null;
            },
            startDragCursorFromLine(e) {
                // double click expected
                if (this.blockDragCursor) {
                    return;
                }
                if (e.detail > 1) {
                    this.clickThroughDragCursor = true;
                    let element = document.getElementById("large-line-drag")
                    element.style.pointerEvents = 'none'; // this will cause an hover on phase bloc to appear, if phase under, we will updatePhaseTime it
                    setTimeout(() => {
                        element.style.pointerEvents = 'stroke';
                        this.clickThroughDragCursor = false;
                    }, 100);
                } else {
                    // classic use case
                    this.startDragCursor(e);
                }
            },
            startDragCursor(e) {
                this.draggingCursor = true;
                window.addEventListener("mousemove", this.onDragCursor);
                window.addEventListener("mouseup", this.stopDragCursor);
            },
            onDragCursor(e) {
                if (!this.draggingCursor) return;
                let time = this.getTimeFromEvent(e);
                time = Math.max(this.minTime, Math.min(this.maxTime, time));
                this.updateTime(time * 1000);
            },
            stopDragCursor() {
                this.draggingCursor = false;
                window.removeEventListener("mousemove", this.onDragCursor);
                window.removeEventListener("mouseup", this.stopDragCursor);
            },
            onSimpleTimelineSliderMouseMove(e) {
                const slider = document.getElementById(this.htmlElementIDs.simpleTimelineID);

                if (this.useAdvancedTimeline || !slider || !slider.classList.contains("slider")) {
                    this.hideSimpleTimelineTooltip();
                    return;
                }

                const rect = slider.getBoundingClientRect();

                // Show the tooltip while the pointer is inside the slider on both axes.
                if (rect.width <= 0 ||
                    rect.height <= 0 ||
                    e.clientX < rect.left ||
                    e.clientX > rect.right ||
                    e.clientY < rect.top ||
                    e.clientY > rect.bottom) {
                    this.hideSimpleTimelineTooltip();
                    return;
                }

                if (!this.simpleTimelineTooltip) {
                    this.simpleTimelineTooltip = document.createElement("div");
                    this.simpleTimelineTooltip.className = "simple-timeline-time-tooltip";
                    document.body.appendChild(this.simpleTimelineTooltip);
                }

                const clampedX = Math.max(rect.left, Math.min(e.clientX, rect.right));
                const ratio = (clampedX - rect.left) / rect.width;
                const min = Number(slider.min) || 0;
                const max = Number(slider.max) || 0;
                const time = (min + ratio * (max - min)) / 1000;

                this.simpleTimelineTooltip.textContent = this.formatTime(time);

                const tooltipWidth = this.simpleTimelineTooltip.offsetWidth;
                const tooltipHalfWidth = tooltipWidth / 2;

                const tooltipX = Math.max(rect.left + tooltipHalfWidth, Math.min(clampedX, rect.right - tooltipHalfWidth));

                this.simpleTimelineTooltip.style.left = `${tooltipX}px`;
                this.simpleTimelineTooltip.style.top = `${rect.top - 24}px`;
                this.simpleTimelineTooltip.style.display = "block";
            },

            hideSimpleTimelineTooltip() {
                if (this.simpleTimelineTooltip) {
                    this.simpleTimelineTooltip.style.display = "none";
                }
            },
        },
    });
</script>
