<template>
    <div>
        <div class="rot-dropdown-pos" style="margin-left: 145px;">
            <a href="#" class="dropdown-toggle rot-font-dropdown" data-toggle="dropdown" title="Filter Skills">
                Skills <span class="caret"></span>
            </a>
            <img class="icon ml-2" :src="UIIcons.QuestionMark"
                data-original-title="Use Skills dropdown to hide unwanted skills" />
            <ul class="dropdown-menu p-2 font-weight-normal scrollabledropdown min-wd-165px" style="width:auto;">
                <li class="d-flex flex-column justify-content-center align-items-center mb-1">
                    <button type="button" class="btn btn-primary btn-sm rot-button"
                            @click="for (var i = 0; i < skillList.length; i++) {selectedSkills['s' + skillList[i].id] = true;}" @click.stop="stopClickEvent">
                        Select all
                    </button>
                </li>
                <li class="d-flex flex-column justify-content-center align-items-center mb-1 separator-border-bottom">
                    <button type="button" class="btn btn-primary btn-sm rot-button"
                            @click="for (var i = 0; i < skillList.length; i++) {selectedSkills['s' + skillList[i].id] = false;}" @click.stop="stopClickEvent">
                        Deselect all
                    </button>
                </li>
                <li v-for="(skill, index) in skillList" :key="index">
                    <div style="width: max-content;">
                        <input :id="'advanced-rotation-player-' + index  + '-' + phaseindex" type="checkbox"
                            v-model="selectedSkills['s' + skill.id]" @click.stop="stopClickEvent" />
                        <label :for="'advanced-rotation-player-' + index + '-' + phaseindex" @click.stop="stopClickEvent"
                            class="rot-font">                                     
                            <img class="icon" 
                                    :src="getSkill(skill.id).icon">
                            {{skill.name}}
                        </label>  
                    </div>        
                </li>
            </ul>
        </div>
        <graph-component :id="graphid" :layout="layout" :data="data" :removerangecontrol="true"></graph-component>
        <rotation-legend-component></rotation-legend-component>
    </div>
</template>

<script>

    function getAdvancedRotationLayout(images, color, nbLines) {
        var layout = {
            barmode: 'stack',
            legend: {
                traceorder: 'reversed'
            },
            hovermode: "closest",
            hoverdistance: 50,
            images: images,
            font: {
                color: color
            },
            xaxis: {
                title: 'Time(sec)',
                color: color,
                gridcolor: color,
                rangemode: 'nonnegative',
                xrangeslider: {},
                tickmode: 'auto',
                nticks: 8
            },
            yaxis: {
                tickmode: 'auto',
                color: color,
                tickformat: ",d",
                range: [-nbLines, 1]
            },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            shapes: [],
            annotations: [],
            margin: {
                l: 150,
            },
            height: 850,
            datarevision: new Date().getTime(),
        };
        return layout;
    };

    function computeAdvancedRotationData(rotationData, images, data, phase, actor, selectedSkills) {
    if (rotationData) {
        const rotaTrace = {
            x: [],
            base: [],
            y: [],
            name: actor.name,
            text: [],
            orientation: 'h',
            mode: 'markers',
            textposition: "none",
            type: 'bar',
            width: [],
            hoverinfo: 'text',
            hoverlabel: {
                namelength: '-1'
            },
            yaxis: 'y',
            marker: {
                color: [],
                width: '2.5',
                line: {
                    color: [],
                    width: '1.0'
                }
            },
            showlegend: false
        };
        let timeOffset = 0;
        let yAxisOffset = 0;
        for (let i = 0; i < rotationData.length; i++) {
            const item = rotationData[i];
            const x = item[0];
            const skillId = item[1];
            let duration = item[2];
            const endType = item[3];
            const quick = item[4];
            const skill = findSkill(false, skillId);
            let aa = false;
            let icon;
            let name = '???';
            let swap = false;
            if (skill) {
                aa = skill.aa;
                icon = skill.icon;
                name = skill.name;
                swap = skill.isSwap;
            }
            if (!swap && !selectedSkills['s'+skillId]) {
                continue;
            }

            if (!icon.includes("render") && !icon.includes("darthmaim")) {
                icon = null;
            }

            let fillColor;
            const originalDuration = duration;
            let yOffset = 0.6;
            let width = aa ? 0.25 : 0.5;
            if (endType === RotationStatus.REDUCED) { 
                fillColor = 'rgb(0,0,255)'; 
            } else if (endType === RotationStatus.CANCEL) { 
                fillColor = 'rgb(255,0,0)'; 
            } else if (endType === RotationStatus.FULL || endType === RotationStatus.CUSTOM_MOVEMENT) { 
                fillColor = 'rgb(147, 112, 219)'; 
                if (endType === RotationStatus.CUSTOM_MOVEMENT) {
                    width = 0.15;
                    yOffset = 0.5;
                }
            } else if (endType === RotationStatus.INSTANT) { 
                fillColor = 'rgb(0,255,255)'; 
                duration = 50; // so that the quad is visible
                width = 0.35;
            } else { // UNKNOWN
                fillColor = 'rgb(255,255,0)'; 
            }

            var clampedX = Math.max(x, 0);
            const diffX = clampedX - x;
            const clampedWidth = Math.min(x + duration / 1000.0, phase.duration / 1000.0) - x - diffX;
            clampedX -= timeOffset;
            if (!aa && icon) {
                images.push({
                    source: icon,
                    xref: 'x',
                    yref: 'y',
                    x: clampedX,
                    y: 0.0 - yAxisOffset,
                    sizex: 0.5,
                    sizey: 0.5,
                    xanchor: 'middle',
                    yanchor: 'bottom'
                });
            }

            rotaTrace.x.push(clampedWidth - 0.001);
            rotaTrace.base.push(clampedX);
            rotaTrace.y.push(yOffset - yAxisOffset);
            const text = `${name} at ${x}s`;
            rotaTrace.text.push(endType === RotationStatus.INSTANT ? text : text + ` for ${originalDuration}ms`);
            rotaTrace.width.push(width);
            rotaTrace.marker.color.push(fillColor);

            const outlineR = quick > 0.0 ? quick * quickColor.r + (1.0 - quick) * normalColor.r : -quick * slowColor.r + (1.0 + quick) * normalColor.r;
            const outlineG = quick > 0.0 ? quick * quickColor.g + (1.0 - quick) * normalColor.g : -quick * slowColor.g + (1.0 + quick) * normalColor.g;
            const outlineB = quick > 0.0 ? quick * quickColor.b + (1.0 - quick) * normalColor.b : -quick * slowColor.b + (1.0 + quick) * normalColor.b;
            rotaTrace.marker.line.color.push('rgb(' + outlineR + ',' + outlineG + ',' + outlineB + ')');
            if (swap) {
                yAxisOffset++;
                timeOffset = x;
            }
        }
        data.push(rotaTrace);
        return yAxisOffset;
    }
    return 0;
}

    Vue.component("advancedrotation-component", {
        props: ["phaseindex", "light", "actorindex", "target"],
        template: `${template}`,
        mixins: [graphComponent, UIIconsComponent],
        watch: {
            light: {
                handler: function () {
                    var textColor = this.light ? '#495057' : '#cccccc';
                    this.layout.yaxis.gridcolor = textColor;
                    this.layout.yaxis.color = textColor;
                    this.layout.xaxis.gridcolor = textColor;
                    this.layout.xaxis.color = textColor;
                    this.layout.font.color = textColor;
                    for (var i = 0; i < this.layout.shapes.length; i++) {
                        this.layout.shapes[i].line.color = textColor;
                    }
                    this.layout.datarevision = new Date().getTime();
                }
            },
            selectedSkills: {
                deep: true,
                handler: function () {
                    this.computeLayout();
                }
            }
        },
        data: function () {
            var selectedSkills = {};
            var skillList = [];
            var rotation = this.target ? logData.targets[this.actorindex].details.rotation[this.phaseindex] : logData.players[this.actorindex].details.rotation[this.phaseindex];
            for (var i = 0; i < rotation.length; i++) {
                var rota = rotation[i];
                var skillID = rota[1];
                var skill = this.getSkill(skillID);
                if (skill.isSwap || selectedSkills['s' + skillID]) {
                    continue;
                }
                skillList.push({name: skill.name, id: skillID});
                selectedSkills['s'+skillID] = true;
            }
            skillList.sort((x,y) => {
                if (x.name < y.name) {
                    return -1;
                }
                if (x.name > y.name) {
                    return 1;
                }
                return 0;
            });
            return {
                selectedSkills: selectedSkills,
                skillList: skillList,
            };
        },
        created: function () {
            this.computeLayout();
        },
        activated: function () {
            var div = document.getElementById(this.graphid);
            var _this = this;
            div.on('plotly_relayout', function (evt) {
                var layout = _this.layout;
                var images = layout.images;
                var x0 = layout.xaxis.range[0];
                var x1 = layout.xaxis.range[1];
                var y0 = layout.yaxis.range[0];
                var y1 = layout.yaxis.range[1];
                //console.log("re-layout " + x0 + " " + x1);
                if (_this.updateVisibilyInQuad(images, x0, x1, y0, y1)) {
                    layout.datarevision = new Date().getTime();
                    //console.log("re-drawing");
                }
            });
        },
        computed: {
            phase: function () {
                return logData.phases[this.phaseindex];
            },
            actor: function () {
                return this.target ? logData.targets[this.actorindex] : logData.players[this.actorindex];
            },
            graphid: function () {
                return (this.target ? "target" : "player") + "advancedrotation-" + this.actorindex + '-' + this.phaseindex;
            },
            rotation: function () {
                return this.actor.details.rotation[this.phaseindex];
            }
        },
        methods: {       
            computeLayout: function() {
                var backUpXAxis = null;
                if (this.layout) {
                    backUpXAxis = this.layout.xaxis;
                }
                this.data = [];
                var images = [];
                var nbLines = computeAdvancedRotationData(this.rotation, images, this.data, this.phase, this.actor, this.selectedSkills);
                this.layout = getAdvancedRotationLayout(images, this.light ? '#495057' : '#cccccc', nbLines);
                if (backUpXAxis) {
                    this.layout.xaxis = backUpXAxis;
                }
                this.updateVisibily(this.layout.images, this.phase.start, this.phase.end);
            },
            stopClickEvent: function (event) {
                event.stopPropagation();
            },
            getSkill: function (id) {
                return findSkill(false, id);
            },
        }
    });
</script>
