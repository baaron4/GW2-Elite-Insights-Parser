<template>
    <div>     
        <div v-if="minionsToUse.length > 0">
            <ul class="nav nav-tabs">
                <li>
                    <a class="nav-link" :class="{active: minionIndex === -1}" @click="minionIndex = -1">{{player.name}}</a>
                </li>
                <li v-for="minionStruct in minionsToUse">
                    <a class="nav-link" :class="{active: minionIndex === minionStruct.minionIndex}"
                        @click="minionIndex = minionStruct.minionIndex">{{minionStruct.minion.name}}</a>
                </li>
            </ul>
        </div>
        <div :key="'activedurationplayer'" class="d-flex flex-row justify-content-center mt-1 mb-1">
            <ul class="nav nav-pills d-flex flex-row justify-content-center scale85">
                <li class="nav-item">
                    <a class="nav-link" @click="activeduration = 0" data-original-title="Buffs upkeep applied by each player to the selected player based on currently selected phase."
                       :class="{active: activeduration === 0}">Phase duration</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" @click="activeduration = 1" data-original-title="Buffs upkeep applied by each player to the selected player based on currently selected phase. Removed dead and disconnected times."
                       :class="{active: activeduration === 1 }">Phase active duration</a>
                </li>
            </ul>
        </div>
        
        <div v-for="minionStruct in minionsToUse"
            v-show="minionStruct.minionIndex === minionIndex && player.minions[minionStruct.minionIndex].instances.length > 1">
            <div class="d-flex flex-row justify-content-center align-items-center mt-1 mb-1 scale85">
                <select :value="minionStruct.minionIndex + ':-1'" class="form-control form-control-sm w-auto minion-buff-selector" @change="handleMinionChange">
                    <option :value="minionStruct.minionIndex + ':-1'" selected>Consolidated View</option>
                    <option v-for="(minion, minionInstanceIndex) in player.minions[minionStruct.minionIndex].instances"
                        :key="'uptime-minion-' + minionStruct.minionIndex + '-' + minionInstanceIndex"
                        :value="minionStruct.minionIndex + ':' + minionInstanceIndex">
                        {{player.minions[minionStruct.minionIndex].name}} #{{minionInstanceIndex + 1}}
                    </option>
                </select>
            </div>
        </div>
        <div class="mt-1 mb-1">
            <buff-table-component :condition="false" :generation="true" :id="'boon-stats-player-table-' + player.id" :buffs="boons"
                                  :playerdata="boonData" :sums="boonSums" :playerindex="-1" :hidecustom="false"></buff-table-component>
        </div>
    </div>
</template>

<script>
    Vue.component("buff-stats-player-component", {
        props: ['playerindex'],
        mixins: [buffComponent, buffPlayerMinionsComponent, minionTabulatedComponent, encounterPhaseComponent],
        template: `${template}`,
        data: function () {
            return {
                activeduration: 1,
                cacheBoon: new Map(),
                cacheBoonSums: new Map(),
            };
        },
        computed: {
            player: function() {
                return logData.players[this.playerindex];
            },
            boonData: function() {
                const id = this.getCacheID();
                if (this.cacheBoon.has(id)) {
                    return this.cacheBoon.get(id);
                }
                const res = [];
                const activeTimes = this.phase.playerActiveTimes;
                const activeduration = this.activeduration;
                const players = getActivePlayersForPhase(this.encounterPhase);
                let dictionaries = activeduration ? 
                    this.buffsStatContainer.boonActiveDictionaries[this.playerindex] 
                    : 
                    this.buffsStatContainer.boonDictionaries[this.playerindex];
                if (this.selectedMinion) {
                    const minionInstanceIndex = this.minionInstanceIndex;
                    dictionaries = activeduration ? 
                        this.selectedMinionBuffs.boonActiveDictionaries[minionInstanceIndex] 
                        : 
                        this.selectedMinionBuffs.boonDictionaries[minionInstanceIndex];
                }
                for (let i = 0; i < players.length; i++) {
                    if (!players[i] || (activeduration && activeTimes[i] < 1e-6)) {
                        continue;
                    }
                    res.push({
                        player: players[i],
                        data: dictionaries[i]
                    });
                }
                this.cacheBoon.set(id, res);
                return res;
            },
            boonSums: function() {
                const id = this.getSumCacheID();
                if (this.cacheBoonSums.has(id)) {
                    return this.cacheBoonSums.get(id);
                }
                const res = [];
                const activeduration = this.activeduration;
                if (this.selectedMinion) {
                    const minionInstanceIndex = this.minionInstanceIndex;
                    const minionData = activeduration ? this.selectedMinionBuffs.boonActiveStats[minionInstanceIndex] : this.selectedMinionBuffs.boonStats[minionInstanceIndex];
                    res.push({
                        icon: this.selectedMinion.icon,
                        name: this.selectedMinion.name,
                        avg: minionData.avg,
                        data: minionData.data
                    });
                    this.cacheBoonSums.set(id, res);
                    return res;
                }
                const playerData = activeduration ? this.buffsStatContainer.boonActiveStats[this.playerindex] : this.buffsStatContainer.boonStats[this.playerindex];
                const activeTimes = this.phase.playerActiveTimes;
                if (activeduration && activeTimes[this.playerindex] < 1e-6) {
                    res.push({
                        icon: this.player.icon,
                        name: this.player.name,
                        avg: 0,
                        data: []
                    });
                } else {
                    res.push({
                        icon: this.player.icon,
                        name: this.player.name,
                        avg: playerData.avg,
                        data: playerData.data
                    });
                }
                this.cacheBoonSums.set(id, res);
                return res;
            },
        },
    });
</script>
