<template>
    <div>
        <div v-if="minionsWithInstanceToUse.length > 0">
            <ul class="nav nav-tabs">
                <li>
                    <a class="nav-link" :class="{active: minionIndex === -1}" @click="minionIndex = -1">{{actor.name}}</a>
                </li>
                <li v-for="minionStruct in minionsWithInstanceToUse">
                    <a class="nav-link" :class="{active: minionIndex === minionStruct.minionIndex}"
                        @click="minionIndex = minionStruct.minionIndex">{{minionStruct.minion.name}}</a>
                </li>
            </ul>
        </div>
            <simplerotation-component
                v-show="minionIndex === -1"
                :actorIndex="actorIndex"
                :phaseindex="phaseindex" :target="target" :minionIndex="-1">
            </simplerotation-component>  
            <simplerotation-component v-for="minionStruct in minionsToUse" 
                v-show="minionIndex === minionStruct.minionIndex"
                :actorIndex="actorIndex"
                :phaseindex="phaseindex" :target="target" :minionIndex="minionStruct.minionIndex">
            </simplerotation-component>  
    </div>
</template>

<script>
    Vue.component("simplerotation-selector-component", {
        props: ["actorIndex", "phaseindex", "target"],
        mixins: [minionTabulatedComponent],
        template: `${template}`,
        computed: {
           actor: function(){         
                const data = this.target ? logData.targets : logData.players;
                return data[this.actorIndex];
           },
        },
    });
</script>
