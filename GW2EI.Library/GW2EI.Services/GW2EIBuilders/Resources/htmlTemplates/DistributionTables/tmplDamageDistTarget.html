<template>
    <div>
        <minion-nav-tab-component :source="this" :withInstances="false"></minion-nav-tab-component>
        <damagedist-table-component :dmgdist="dmgdist" :tableid="'dmgdist-target-' + targetindex"
            :actorIndex="targetindex" :minionIndex="minionIndex" 
            :player="false" :isTarget="false"
            :phaseindex="phaseindex"></damagedist-table-component>
    </div>
</template>

<script>
    Vue.component('dmgdist-target-component', {
        props: ['targetindex',
            'phaseindex'
        ],
        mixins: [minionTabulatedComponent],
        template: `${template}`,
        computed: {
            actor: function() {
                return this.target;
            },
            target: function () {
                return logData.targets[this.targetindex];
            },
            dmgdist: function () {
                if (this.minionIndex === -1) {
                    return this.target.details.dmgDistributions[this.phaseindex];
                }
                return this.target.minions[this.minionIndex].details.dmgDistributions[this.phaseindex];
            }
        },
    });
</script>
