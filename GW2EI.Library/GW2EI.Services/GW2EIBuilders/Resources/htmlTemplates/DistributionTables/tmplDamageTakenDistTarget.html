<template>
    <div>
        <minion-nav-tab-component :source="this" :withInstances="false"></minion-nav-tab-component>
        <damagedist-table-component :dmgdist="dmgtaken" :tableid="'dmgtakendist-target-' + targetindex" 
            :actorIndex="-1" :minionIndex="minionIndex" :isTarget="false" :player="false"
            :phaseindex="phaseindex">
        </damagedist-table-component>
    </div>
</template>

<script>
    Vue.component('dmgtakendist-target-component', {
        props: ['targetindex','phaseindex'],
        template: `${template}`,
        mixins: [minionTabulatedComponent],
        computed: {
            actor: function() {
                return this.target;
            },
            target: function () {
                return logData.targets[this.targetindex];
            },
            dmgtaken: function () {
                if (this.minionIndex === -1) {
                    return this.target.details.dmgDistributionsTaken[this.phaseindex];
                }
                return this.target.minions[this.minionIndex].details.dmgDistributionsTaken[this.phaseindex];
            }
        },
    });
</script>
