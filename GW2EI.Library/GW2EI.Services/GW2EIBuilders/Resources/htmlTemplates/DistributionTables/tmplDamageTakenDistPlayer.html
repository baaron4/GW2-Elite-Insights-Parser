<template>
    <div>
        <div v-if="minionsToUse.length > 0">
            <ul class="nav nav-tabs">
                <li>
                    <a class="nav-link" :class="{active: minionIndex === -1}" @click="minionIndex = -1">{{player.name}}</a>
                </li>
                <li v-for="(minion, mindex) in minionsToUse">
                    <a class="nav-link" :class="{active: minionIndex === mindex}"
                        @click="minionIndex = mindex">{{minion.name}}</a>
                </li>
            </ul>
        </div>
        <damagedist-table-component :dmgdist="dmgtaken" :tableid="'dmgtakendist-' + playerindex" 
            :actorIndex="-1" :minionIndex="minionIndex" :isTarget="false" :player="true"
            :phaseindex="phaseindex">
        </damagedist-table-component>
    </div>
</template>

<script>
    Vue.component('dmgtakendist-player-component', {
        props: ['playerindex','phaseindex'],
        template: `${template}`,
        mixins: [minionTabulatedComponent],
        computed: {
            actor: function() {
                return this.player;
            },
            player: function () {
                return logData.players[this.playerindex];
            },
            dmgtaken: function () {
                if (this.minionIndex === -1) {
                    return this.player.details.dmgDistributionsTaken[this.phaseindex];
                }
                return this.player.minions[this.minionIndex].details.dmgDistributionsTaken[this.phaseindex];
            }
        },
    });
</script>
