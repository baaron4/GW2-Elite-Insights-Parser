<template>
    <div>
        <minion-nav-tab-component :source="this" :withInstances="true"></minion-nav-tab-component>
        <div :key="'activedurationplayer'" class="d-flex flex-row justify-content-center mt-1 mb-1">
            <ul class="nav nav-pills d-flex flex-row justify-content-center scale85">
                <li class="nav-item">
                    <a class="nav-link" @click="activeduration = 0" data-original-title="Buffs volumes applied by each player to the selected player based on currently selected phase."
                       :class="{active: activeduration === 0}">Phase duration</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" @click="activeduration = 1" data-original-title="Buffs volumes applied by each player to the selected player based on currently selected phase. Removed dead and disconnected times."
                       :class="{active: activeduration === 1 }">Phase active duration</a>
                </li>
            </ul>
        </div>
        <minion-instance-dropdown-component :source="this"></minion-instance-dropdown-component>
        <div class="mt-1 mb-1">
            <buff-volume-table-component :outgoing="true" :id="'boon-volume-stats-player-table-' + player.id" :buffs="boons"
                                         :playerdata="boonData" :sums="boonSums" :playerindex="-1" :hidecustom="false"></buff-volume-table-component>
        </div>
    </div>
</template>

<script>
    Vue.component("buff-volume-stats-player-component", {
        props: ['playerindex'],
        mixins: [buffComponent, buffPlayerMinionsComponent, minionTabulatedComponent, encounterPhaseComponent, buffPlayerWithActiveTimeComponent, buffPlayerMinionsWithActiveTimeComponent, numberComponent],
        template: `${template}`,
        data: function () {
            return {
                activeduration: 1,
                cacheBoon: new Map(),
                cacheBoonSums: new Map(),
            };
        },
        created: function() {
            this.allowConsolidated = true;
        },
        computed: {
            player: function() {
                return logData.players[this.playerindex];
            },      
            boonData: function() {
                const id = this.getCacheID();
                if (this.cacheBoon.has(id)) {
                    return this.cacheBoon.get(id);
                }
                const phase = this.phase;
                const res = [];
                const activeduration = this.activeduration;
                if (this.consolidatedMinionView) {
                    const minionsData = activeduration ? this.selectedMinionVolumeContainer.boonVolumeActiveStats : this.selectedMinionVolumeContainer.boonVolumeStats;
                    for (let i = 0; i < minionsData.length; i++) {
                        const minionData = minionsData[i];
                        res.push({
                            player: {
                                name: getMinionLabel(this.selectedMinion.name, i),
                                profession: null,
                                icon: this.selectedMinion.icon,
                                group: null
                            },
                            data: minionData
                        });
                    }
                    this.cacheBoon.set(id, res);
                    return res;
                }
                const players = getActiveNonFakePlayersForPhase(this.encounterPhase);
                let dictionaries = activeduration ? 
                    this.buffVolumesStatContainer.boonVolumeActiveDictionaries[this.playerindex] 
                    :  
                    this.buffVolumesStatContainer.boonVolumeDictionaries[this.playerindex];
                if (this.selectedMinion) {
                    const minionInstanceIndex = this.minionInstanceIndex;
                    dictionaries = activeduration ? 
                        this.selectedMinionVolumeContainer.boonVolumeActiveDictionaries[minionInstanceIndex] 
                        : 
                        this.selectedMinionVolumeContainer.boonVolumeDictionaries[minionInstanceIndex];
                }
                for (let i = 0; i < players.length; i++) {
                    if (!players[i]) {
                        continue;
                    }
                    res.push({
                        player: players[i],
                        data: dictionaries[i]
                    });
                }
                this.cacheBoon.set(id, res);
                return res;
            },
            boonSums: function() {
                const id = this.getSumCacheID();
                if (this.cacheBoonSums.has(id)) {
                    return this.cacheBoonSums.get(id);
                }
                const res = [];
                const activeduration = this.activeduration;
                 if (this.consolidatedMinionView) {
                    const minionsData = activeduration ? this.selectedMinionVolumeContainer.boonVolumeActiveStats : this.selectedMinionVolumeContainer.boonVolumeStats;
                    let totalAvg = [];
                    let totalCount = 0;
                    for (let i = 0; i < minionsData.length; i++) {
                        const minionData = minionsData[i] ;
                        const weight = this.getMinionInstanceWeight(i, activeduration);
                        totalCount += weight;
                        for (let j = 0; j < minionData.data.length; j++) {                 
                            totalAvg[j] = (totalAvg[j] || 0) + weight * (minionData.data[j][0] || 0);
                        }
                    }
                    for (let j = 0; j < totalAvg.length; j++) {
                        totalAvg[j] = this.round3(totalAvg[j] / totalCount);
                    }
                    res.push({
                        name: "Total",
                        data: totalAvg,
                    })
                    this.cacheBoonSums.set(id, res);
                    return res;
                }
                if (this.selectedMinion) {
                    const minionInstanceIndex = this.minionInstanceIndex;
                    const minionData = activeduration ? this.selectedMinionVolumeContainer.boonVolumeActiveStats[minionInstanceIndex] : this.selectedMinionVolumeContainer.boonVolumeStats[minionInstanceIndex];
                    res.push({
                        icon: this.selectedMinion.icon,
                        name: this.selectedMinion.name,
                        data: minionData.data
                    });
                    this.cacheBoonSums.set(id, res);
                    return res;
                }
                const playerData = activeduration ? this.buffVolumesStatContainer.boonVolumeActiveStats[this.playerindex] : this.buffVolumesStatContainer.boonVolumeStats[this.playerindex];
                const playerWeight = this.getPlayerWeight(this.playerindex, activeduration);
                if (playerWeight < 1e-6) {
                    res.push({
                        icon: this.player.icon,
                        name: this.player.name,
                        data: []
                    });
                } else {
                    res.push({
                        icon: this.player.icon,
                        name: this.player.name,
                        data: playerData.data
                    });
                }
                this.cacheBoonSums.set(id, res);
                return res;
            },
        },
    });
</script>
