<template>
    <div>
        <minion-nav-tab-component :source="this" :withInstances="false"></minion-nav-tab-component>
        <barrierdist-table-component :barrierdist="barriertaken" :tableid="'barriertakendist-' + playerindex"
            :actorIndex="-1" :minionIndex="minionIndex" :isTarget="false" :player="true"
            :phaseindex="phaseindex">
        </barrierdist-table-component>
    </div>
</template>

<script>
    Vue.component('barriertakendist-player-component', {
        props: ['playerindex','phaseindex'],
        template: `${template}`,
        mixins: [minionTabulatedComponent],
        computed: {
            actor: function() {
                return this.player;
            },
            player: function () {
                return logData.players[this.playerindex];
            },
            barriertaken: function () {
                if (this.minionIndex === -1) {
                    return barrierStatsExtension.playerBarrierDetails[this.playerindex].incomingBarrierDistributions[this.phaseindex];
                }
                return barrierStatsExtension.playerBarrierDetails[this.playerindex].minions[this.minionIndex].incomingBarrierDistributions[this.phaseindex];
            }
        },
    });
</script>
