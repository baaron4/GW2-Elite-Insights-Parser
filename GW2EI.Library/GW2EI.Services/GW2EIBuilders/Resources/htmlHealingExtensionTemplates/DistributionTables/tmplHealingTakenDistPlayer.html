<template>
    <div>
        <div v-if="player.minions.length > 0">
            <ul class="nav nav-tabs">
                <li>
                    <a class="nav-link" :class="{active: minionIndex === -1}" @click="minionIndex = -1">{{player.name}}</a>
                </li>
                <li v-for="(minion, mindex) in player.minions">
                    <a class="nav-link" :class="{active: minionIndex === mindex}"
                        @click="minionIndex = mindex">{{minion.name}}</a>
                </li>
            </ul>
        </div>
        <healingdist-table-component :healingdist="healingtaken" :tableid="'healingtakendist-' + playerindex" 
            :actorindex="-1" :minionIndex="minionIndex" :istarget="false" :player="true"
            :phaseindex="phaseindex">
        </healingdist-table-component>
    </div>
</template>

<script>
    Vue.component('healingtakendist-player-component', {
        props: ['playerindex','phaseindex'],
        template: `${template}`,
        data: function () {
            return {
                minionIndex: -1
            };
        },
        computed: {
            player: function () {
                return logData.players[this.playerindex];
            },
            healingtaken: function () {      
                if (this.minionIndex === -1) {
                    return healingStatsExtension.playerHealingDetails[this.playerindex].incomingHealingDistributions[this.phaseindex];
                }
                return healingStatsExtension.playerHealingDetails[this.playerindex].minions[this.minionIndex].incomingHealingDistributions[this.phaseindex];
            }
        },
    });
</script>
